name: 'Build System-test base images'
description: 'Downloads the release artifacts for the given Azure DevOps build and builds/pushes the system-test docker base images'

inputs:
  azdo_build_id:
    description: 'The specific AzDo build from which the release artifacts will be downloaded'
    required: true

  branch_name:
    description: 'Branch name for tagging (optional). If provided, tags as branch name instead of latest_snapshot'
    required: false

  github_token:
    description: 'Github token for pushing images to ghcr.io Docker repository'
    required: true

  azure_devops_token:
    description: >-
      An Azure Devops PAT for downloading the release artifacts. Optional - if not provided,
      artifacts are downloaded anonymously (works for public projects, but has tighter rate limits)
    required: false

runs:
  using: "composite"
  steps:

    - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
      with:
        global-json-file: global.json

    - name: "Get current version"
      id: versions
      shell: bash
      run: ./tracer/build.sh OutputCurrentVersionToGitHub

    - name: "Download build assets from Azure Pipelines"
      id: assets
      shell: bash
      run: ./tracer/build.sh DownloadAzurePipelineFromBuild
      env:
        AzureDevopsBuildId: "${{ inputs.azdo_build_id }}"
        AZURE_DEVOPS_TOKEN: "${{ inputs.azure_devops_token }}"

    - name: "Sanitize branch name"
      id: image_tag
      shell: bash
      run: |
        BRANCH="$BRANCH_NAME_INPUT"
        if [[ -z "$BRANCH" ]]; then
          echo "ERROR: Missing required 'branch_name' input. Aborting docker image build."
          exit 1
        fi
        SAFE_TAG="${BRANCH//\//_}"
        echo "tag=$SAFE_TAG" >> $GITHUB_OUTPUT
      env:
        BRANCH_NAME_INPUT: "${{ inputs.branch_name }}"

    - name: Copy tooling files to artifacts path
      shell: bash
      run: |
        echo "OUTPUT ARTIFACT PATH: ${{ steps.assets.outputs.artifacts_path }}"
        cp ./tracer/build/_build/docker/system-tests.dockerfile ${{ steps.assets.outputs.artifacts_path }}

    - name: Set up QEMU
      uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0

    - name: Set up Docker Buildx
      id: buildx
      uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

    - name: Login to Docker
      shell: bash
      run: docker login -u publisher -p ${{ inputs.github_token }} ghcr.io

    - name: Docker Build linux-x64 and linux-arm64 images
      uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
      with:
        push: true
        tags: ghcr.io/datadog/dd-trace-dotnet/dd-trace-dotnet:${{ steps.image_tag.outputs.tag || 'latest_snapshot' }}
        platforms: 'linux/amd64,linux/arm64'
        context: ${{ steps.assets.outputs.artifacts_path }}
        file: ${{ steps.assets.outputs.artifacts_path }}/system-tests.dockerfile
        build-args: |
          LINUX_AMD64_PACKAGE=datadog-dotnet-apm-${{ steps.versions.outputs.version }}.tar.gz
          LINUX_ARM64_PACKAGE=datadog-dotnet-apm-${{ steps.versions.outputs.version }}.arm64.tar.gz
          LIBRARY_VERSION=${{ steps.versions.outputs.version }}
          LIBDDWAF_VERSION=${{ steps.versions.outputs.lib_waf_version }}
          APPSEC_EVENT_RULES_VERSION=${{ steps.versions.outputs.waf_rules_version }}
