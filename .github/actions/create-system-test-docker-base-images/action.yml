name: 'Build System-test base images'
description: 'Downloads the release artifacts for the given Azure DevOps build and builds/pushes the system-test docker base images'

inputs:
  azdo_build_id:
    description: 'The specific AzDo build from which the release artifacts will be downloaded'
    required: true

  branch_name:
    description: 'Branch name for tagging (optional). If provided, tags as branch name instead of latest_snapshot'
    required: false

  github_token:
    description: 'Github token for pushing images to ghcr.io Docker repository'
    required: true

  azure_devops_token:
    description: >-
      An Azure Devops PAT for downloading the release artifacts. Optional - if not provided,
      artifacts are downloaded anonymously (works for public projects, but has tighter rate limits)
    required: false

runs:
  using: "composite"
  steps:

    - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: global.json

    - name: "Get current version"
      id: versions
      shell: bash
      run: ./tracer/build.sh OutputCurrentVersionToGitHub

    - name: "Download build assets from Azure Pipelines"
      id: assets
      shell: bash
      run: ./tracer/build.sh DownloadAzurePipelineFromBuild
      env:
        AzureDevopsBuildId: "${{ inputs.azdo_build_id }}"
        AZURE_DEVOPS_TOKEN: "${{ inputs.azure_devops_token }}"

    - name: "Sanitize branch name"
      id: image_tag
      shell: bash
      run: |
        BRANCH="$BRANCH_NAME_INPUT"
        if [[ -z "$BRANCH" ]]; then
          echo "ERROR: Missing required 'branch_name' input. Aborting docker image build."
          exit 1
        fi
        SAFE_TAG="${BRANCH//\//_}"
        echo "tag=$SAFE_TAG" >> $GITHUB_OUTPUT
      env:
        BRANCH_NAME_INPUT: "${{ inputs.branch_name }}"

    - name: Copy tooling files to artifacts path
      shell: bash
      run: |
        echo "OUTPUT ARTIFACT PATH: ${{ steps.assets.outputs.artifacts_path }}"
        cp ./tracer/build/_build/docker/system-tests.dockerfile ${{ steps.assets.outputs.artifacts_path }}

    - name: Set up QEMU
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

    - name: Install Datadog Buildx
      shell: bash
      env:
        BUILDX_VERSION: 0.38.2-dd.3
      run: |
        set -euo pipefail
        case "$(uname -m)" in
          x86_64) arch=amd64; checksum=d974b718dd988bfe661346e8e2ac5751be55475883ae796ae9dea9d0f6cbe0b2 ;;
          aarch64|arm64) arch=arm64; checksum=b22f3da81c913eb76da05143ba49ec3de06224b617161c969c43022add397b29 ;;
          *) echo "Unsupported Buildx architecture" >&2; exit 1 ;;
        esac
        buildx_tmp="$(mktemp -d)"
        trap 'rm -rf "$buildx_tmp"' EXIT
        curl --fail --silent --show-error --location --retry 3 \
          "https://github.com/DataDog/buildx/releases/download/v${BUILDX_VERSION}/buildx_${BUILDX_VERSION}_linux_${arch}.tar.gz" \
          --output "$buildx_tmp/buildx.tar.gz"
        printf '%s  %s\n' "$checksum" "$buildx_tmp/buildx.tar.gz" | sha256sum --check
        tar -xzf "$buildx_tmp/buildx.tar.gz" -C "$buildx_tmp" buildx
        install -D -m 0755 "$buildx_tmp/buildx" "${DOCKER_CONFIG:-$HOME/.docker}/cli-plugins/docker-buildx"
        selected="$(docker buildx version)"
        case "$selected" in
          "github.com/docker/buildx v${BUILDX_VERSION} "*) printf '%s\n' "$selected" ;;
          *) echo "Unexpected Buildx client: $selected" >&2; exit 1 ;;
        esac

    # With no version input, setup-buildx-action reuses the installed client.
    - name: Set up Docker Buildx
      id: buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Login to Docker
      shell: bash
      run: docker login -u publisher -p ${{ inputs.github_token }} ghcr.io

    - name: Docker Build linux-x64 and linux-arm64 images
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        push: true
        tags: ghcr.io/datadog/dd-trace-dotnet/dd-trace-dotnet:${{ steps.image_tag.outputs.tag || 'latest_snapshot' }}
        platforms: 'linux/amd64,linux/arm64'
        context: ${{ steps.assets.outputs.artifacts_path }}
        file: ${{ steps.assets.outputs.artifacts_path }}/system-tests.dockerfile
        build-args: |
          LINUX_AMD64_PACKAGE=datadog-dotnet-apm-${{ steps.versions.outputs.full_version }}.tar.gz
          LINUX_ARM64_PACKAGE=datadog-dotnet-apm-${{ steps.versions.outputs.full_version }}.arm64.tar.gz
          LIBRARY_VERSION=${{ steps.versions.outputs.full_version }}
          LIBDDWAF_VERSION=${{ steps.versions.outputs.lib_waf_version }}
          APPSEC_EVENT_RULES_VERSION=${{ steps.versions.outputs.waf_rules_version }}
