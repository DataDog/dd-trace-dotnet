name: "Publish native debug symbols"
description: 'Publish native debug symbols'

# Datadog symbol-upload API keys are obtained at runtime via Datadog GitHub Workload Identity Federation (WIF)
# intake mappings, which return managed API keys (rotated weekly). The calling JOB must grant
# `permissions: id-token: write` (that cannot be set here), and must expose the target org UUIDs as
# `DD_ORG_UUID_<REGION>` variables (set on the `publish-debug-symbols-env` environment).
# The intake mappings are named `dd-trace-dotnet-api-key-<region>` in each Datadog org.

inputs:
  artifacts_path:
    description: "Path to the build artifacts"
    required: true

runs:
  using: "composite"
  steps:
    # Fail fast with a clear error if any org UUID variable is missing, rather than an opaque WIF exchange failure
    - name: Check Datadog org UUID variables
      shell: bash
      env:
        DD_ORG_UUID_PREPROD: ${{ vars.DD_ORG_UUID_PREPROD }}
        DD_ORG_UUID_US1: ${{ vars.DD_ORG_UUID_US1 }}
        DD_ORG_UUID_US3: ${{ vars.DD_ORG_UUID_US3 }}
        DD_ORG_UUID_US5: ${{ vars.DD_ORG_UUID_US5 }}
        DD_ORG_UUID_EU1: ${{ vars.DD_ORG_UUID_EU1 }}
        DD_ORG_UUID_AP1: ${{ vars.DD_ORG_UUID_AP1 }}
        DD_ORG_UUID_AP2: ${{ vars.DD_ORG_UUID_AP2 }}
        DD_ORG_UUID_UK1: ${{ vars.DD_ORG_UUID_UK1 }}
      run: |
        missing=0
        for name in DD_ORG_UUID_PREPROD DD_ORG_UUID_US1 DD_ORG_UUID_US3 DD_ORG_UUID_US5 DD_ORG_UUID_EU1 DD_ORG_UUID_AP1 DD_ORG_UUID_AP2 DD_ORG_UUID_UK1; do
          if [ -z "${!name}" ]; then
            echo "::error::Variable $name is not set (expected on the publish-debug-symbols-env environment)"
            missing=1
          fi
        done
        exit $missing

    # Obtain Datadog API keys per region via Workload Identity Federation intake mappings
    - name: Get Datadog credentials (preprod)
      id: wif-preprod
      uses: DataDog/datadog-workload-identity-federation-github-action/intake@c9456387851248e0a5452f99085b16ad14fc3acb # v1.0.0
      with:
        org_uuid: ${{ vars.DD_ORG_UUID_PREPROD }}
        site: datad0g.com

    - name: Get Datadog credentials (us1)
      id: wif-us1
      uses: DataDog/datadog-workload-identity-federation-github-action/intake@c9456387851248e0a5452f99085b16ad14fc3acb # v1.0.0
      with:
        org_uuid: ${{ vars.DD_ORG_UUID_US1 }}
        site: datadoghq.com

    - name: Get Datadog credentials (us3)
      id: wif-us3
      uses: DataDog/datadog-workload-identity-federation-github-action/intake@c9456387851248e0a5452f99085b16ad14fc3acb # v1.0.0
      with:
        org_uuid: ${{ vars.DD_ORG_UUID_US3 }}
        site: us3.datadoghq.com

    - name: Get Datadog credentials (us5)
      id: wif-us5
      uses: DataDog/datadog-workload-identity-federation-github-action/intake@c9456387851248e0a5452f99085b16ad14fc3acb # v1.0.0
      with:
        org_uuid: ${{ vars.DD_ORG_UUID_US5 }}
        site: us5.datadoghq.com

    - name: Get Datadog credentials (eu1)
      id: wif-eu1
      uses: DataDog/datadog-workload-identity-federation-github-action/intake@c9456387851248e0a5452f99085b16ad14fc3acb # v1.0.0
      with:
        org_uuid: ${{ vars.DD_ORG_UUID_EU1 }}
        site: datadoghq.eu

    - name: Get Datadog credentials (ap1)
      id: wif-ap1
      uses: DataDog/datadog-workload-identity-federation-github-action/intake@c9456387851248e0a5452f99085b16ad14fc3acb # v1.0.0
      with:
        org_uuid: ${{ vars.DD_ORG_UUID_AP1 }}
        site: ap1.datadoghq.com

    - name: Get Datadog credentials (ap2)
      id: wif-ap2
      uses: DataDog/datadog-workload-identity-federation-github-action/intake@c9456387851248e0a5452f99085b16ad14fc3acb # v1.0.0
      with:
        org_uuid: ${{ vars.DD_ORG_UUID_AP2 }}
        site: ap2.datadoghq.com

    - name: Get Datadog credentials (uk1)
      id: wif-uk1
      uses: DataDog/datadog-workload-identity-federation-github-action/intake@c9456387851248e0a5452f99085b16ad14fc3acb # v1.0.0
      with:
        org_uuid: ${{ vars.DD_ORG_UUID_UK1 }}
        site: uk1.datadoghq.com

    # datadog-ci needs the version 20 (https://github.com/DataDog/profiling-backend/blob/prod/debug-symbol-upload/Dockerfile#L6)
    - name: Install Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 20

    # Use the same go version as in https://github.com/DataDog/profiling-backend/blob/prod/debug-symbol-upload/Dockerfile#L21
    - name: Install Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '^1.22.3'

    # Use the same version of datadog-ci as in https://github.com/DataDog/profiling-backend/blob/prod/debug-symbol-upload/Dockerfile#L14
    - name: Install datadog-ci
      shell: bash
      run: npm install -g @datadog/datadog-ci@3.15.0

    - name: Create debug symbols directory
      shell: bash
      run: |
        linux_artifact=${{inputs.artifacts_path}}/linux-native-symbols.tar.gz
        if [ ! -f $linux_artifact ]; then
          echo "Linux native symbols not found at $linux_artifact"
          exit 1
        fi

        windows_native_symbols=${{inputs.artifacts_path}}/windows-native-symbols.zip
        if [ ! -f $windows_native_symbols ]; then
          echo "Windows native symbols not found at $windows_native_symbols"
          exit 1
        fi

        windows_tracer_home=${{inputs.artifacts_path}}/windows-tracer-home.zip
        if [ ! -f $windows_tracer_home ]; then
          echo "Windows tracer home not found at $windows_tracer_home"
          exit 1
        fi

        export DEBUG_SYMBOLS_DIR="$GITHUB_WORKSPACE/debug_symbols"
        mkdir -p "$DEBUG_SYMBOLS_DIR"
        echo "DEBUG_SYMBOLS_DIR=$DEBUG_SYMBOLS_DIR" >> $GITHUB_ENV

        ## By splitting windows and linux symbols, we prevent trashing the logs
        ## Ex: when running datadog-ci for linux, it will report all PE files as non-ELF files.
        ##     when running datadog-ci for windows, it will report all ELF files as non-PE files.

        linux_subfolder="$DEBUG_SYMBOLS_DIR/linux"
        mkdir "$linux_subfolder"
        # Extract Linux symbols
        tar -zxvf $linux_artifact -C "$linux_subfolder"

        windows_subfolder="$DEBUG_SYMBOLS_DIR/windows"
        mkdir "$windows_subfolder"
        # Extract Windows symbols
        unzip -d "$windows_subfolder" $windows_native_symbols
        # Extract Windows tracer home
        unzip -d "$windows_subfolder" $windows_tracer_home

        # Remove all directories except the ones containing native symbols
        find "$windows_subfolder" -mindepth 1 -maxdepth 1 -type d \
          ! -name dd-dotnet-win-x64 \
          ! -name win-x64 \
          ! -name win-x86 \
          -exec rm -rf {} +

    - name: Push debug symbols
      shell: bash
      env:
        BOLD_GREEN: "\e[1;32m"
        RESET: "\e[0m"
      run: |
        for i in "datad0g.com ${{ steps.wif-preprod.outputs.api_key }}" "datadoghq.com ${{ steps.wif-us1.outputs.api_key }}" "us3.datadoghq.com ${{ steps.wif-us3.outputs.api_key }}" "us5.datadoghq.com ${{ steps.wif-us5.outputs.api_key }}" "datadoghq.eu ${{ steps.wif-eu1.outputs.api_key }}" "ap1.datadoghq.com ${{ steps.wif-ap1.outputs.api_key }}" "ap2.datadoghq.com ${{ steps.wif-ap2.outputs.api_key }}" "uk1.datadoghq.com ${{ steps.wif-uk1.outputs.api_key }}"; do
          site=$(echo $i | cut -d' ' -f1)
          api_key=$(echo $i | cut -d' ' -f2)
          echo -e "${BOLD_GREEN}Pushing symbols to $site${RESET}"
          DATADOG_API_KEY="$api_key" DATADOG_SITE="$site" DD_BETA_COMMANDS_ENABLED=1 datadog-ci elf-symbols upload "$DEBUG_SYMBOLS_DIR/linux"
          DATADOG_API_KEY="$api_key" DATADOG_SITE="$site" DD_BETA_COMMANDS_ENABLED=1 datadog-ci pe-symbols upload "$DEBUG_SYMBOLS_DIR/windows"
        done