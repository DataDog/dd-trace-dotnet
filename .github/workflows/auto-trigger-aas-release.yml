name: Auto trigger AAS version bump

on:
  release:
    types: [published]

jobs:
  trigger_aas_release:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for dd-octo-sts OIDC token

    steps:
      - name: Get GitHub Token via dd-octo-sts
        id: octo-sts
        uses: DataDog/dd-octo-sts-action@c85802a58e202b7e764b5441e4378c76043c8108 # v1.0.5
        with:
          scope: DataDog/datadog-aas-extension
          policy: dd-trace-dotnet.github.trigger-aas-release

      - name: Trigger AAS release
        env:
          GH_TOKEN: ${{ steps.octo-sts.outputs.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          payload=$(jq -nc --arg version "$RELEASE_TAG" --arg is_prerelease "$IS_PRERELEASE" \
            '{event_type: "dd-trace-dotnet-release", client_payload: {is_prerelease: $is_prerelease, version: $version}}')
          curl -fX POST \
          -H "Accept: application/vnd.github.v3+json" \
          -H "Authorization: Bearer $GH_TOKEN" \
          https://api.github.com/repos/DataDog/datadog-aas-extension/dispatches \
          -d "$payload"