name: Build AutoInstrumentation Generator


on:
  push:
    branches: [ master, hotfix/**/* ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Build Datadog.AutoInstrumentation.slnx
        run: dotnet build tracer/tools/Datadog.AutoInstrumentation/Datadog.AutoInstrumentation.slnx
