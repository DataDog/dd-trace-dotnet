# How to configure:
#
# When no team is frozen, set `frozen-teams` to an empty string:
# frozen-teams: ""
#
# When one or more teams are frozen, add them one per line with the @DataDog prefix:
#
# frozen-teams: |
#   @DataDog/team-a
#   @DataDog/team-b

name: Team freeze guard

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - labeled
      - unlabeled
      - ready_for_review

jobs:
  team-freeze-guard:
    name: Team freeze guard
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: DataDog/team-freeze-guard@d28a2e357903b426122feaae225629bd63fcd2c5  # v0.0.5
        with:
          bypass-labels: |
            area:benchmarks
            area:builds
            area:test-apps
            area:tests
            type:flake-fix
          frozen-teams: ""
