name: Scheduled AAS Deployment

on:
  schedule:
    - cron: '30 22 * * FRI'  # Every Friday at 10:30 PM UTC
  workflow_dispatch:
    inputs:
      force_deploy:
        description: '[TESTING] Force deployment outside the release schedule'
        type: boolean
        default: false
      override_week:
        description: '[TESTING] Override week number (even number = deploy)'
        required: false
        type: string

jobs:
  check_schedule:
    uses: ./.github/workflows/_check_release_schedule.yml
    with:
      force_run: ${{ inputs.force_deploy || false }}
      override_week: ${{ inputs.override_week || '' }}

  check_freeze_and_deploy:
    needs: check_schedule
    if: needs.check_schedule.outputs.should_proceed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: write
      id-token: write # required for dd-octo-sts OIDC token

    steps:
      # Check skip milestone
      - uses: octokit/request-action@b91aabaa861c777dcdb14e2387e30eddf04619ae # v3.0.0
        name: 'Check Skip Milestone'
        id: skip_milestone
        with:
          route: GET /repos/{owner}/{repo}/milestones/183 # Skip Scheduled Code Freeze milestone ID
          owner: ${{ github.repository_owner }}
          repo: ${{ github.event.repository.name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Process skip state
        id: check_skip
        run: |
          state=$(echo '${{ steps.skip_milestone.outputs.data }}' | jq -r '.state')
          echo "Milestone state: $state"
          if [ "$state" == "open" ]; then
            echo "Skip milestone is open - will skip code freeze"
            echo "should_proceed=false" >> $GITHUB_OUTPUT
          else
            echo "Skip milestone is closed - will proceed with code freeze"
            echo "should_proceed=true" >> $GITHUB_OUTPUT
          fi

      # Close skip milestone if we're skipping
      - uses: octokit/request-action@b91aabaa861c777dcdb14e2387e30eddf04619ae # v3.0.0
        if: steps.check_skip.outputs.should_proceed == 'false'
        name: 'Close Skip Milestone'
        with:
          route: PATCH /repos/{owner}/{repo}/milestones/183 # Skip Scheduled Code Freeze milestone ID
          owner: ${{ github.repository_owner }}
          repo: ${{ github.event.repository.name }}
          state: closed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Checkout and deploy if we should proceed
      - name: Clone repository
        if: steps.check_skip.outputs.should_proceed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get GitHub Token via dd-octo-sts
        if: steps.check_skip.outputs.should_proceed == 'true'
        id: octo-sts
        uses: DataDog/dd-octo-sts-action@c85802a58e202b7e764b5441e4378c76043c8108 # v1.0.5
        with:
          scope: DataDog/datadog-aas-extension
          policy: dd-trace-dotnet.github.deploy-aas-dev-apps

      - uses: ./.github/actions/deploy-aas-dev-apps
        if: steps.check_skip.outputs.should_proceed == 'true'
        name: 'Trigger AAS deploy'
        with:
          github_token: ${{ steps.octo-sts.outputs.token }}
