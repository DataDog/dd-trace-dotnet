name: Create reusable draft release

on:
  workflow_call:
    inputs:
      forced_commit_id:
        description: 'Force using artifacts from specific commit? If provided, this will try and use the artifacts from the given commit, regardless of build status'
        required: false
        type: string
      ignore_gitlab_failures:
        description: "DANGER Force ignoring any issues with the GitLab artifacts or SSI. Don't use this unless you _really_ know what you're doing"
        required: false
        type: boolean
        default: false
      is_hotfix:
        description: 'Is this a hotfix release? If true, skips vNext milestone renaming'
        required: true
        type: boolean
      stage_nuget_packages:
        description: "Stage the NuGet packages on nuget.org (they must then be promoted on nuget.org before the GitHub release is published). If false, publishes them immediately (fallback)"
        required: true
        type: boolean
    # These must be declared (and explicitly passed by the caller below) even though their
    # actual values come from the job's `environment: publish-debug-symbols-env` secrets, not
    # from the caller's own secrets. Without a declared+passed secret of the same name, the
    # `secrets.X` context inside this reusable workflow resolves empty regardless of the
    # environment secret's value - see https://github.com/actions/runner/issues/1490.
    secrets:
      AZURE_DEVOPS_TOKEN:
        required: true
      NUGET_TRUSTED_PUBLISHING_USERNAME:
        required: true

jobs:
  create_draft_release:
    runs-on: ubuntu-latest
    environment: publish-debug-symbols-env
    # All GitHub API access goes through the dd-octo-sts token; see
    # .github/chainguard/self.github.create-draft-release.sts.yaml
    permissions:
      contents: read # actions/checkout uses the workflow token to clone
      id-token: write # required for dd-octo-sts OIDC and NuGet trusted publishing
    env:
      NUGET_AUTH_HELP: |
        This workflow uses Trusted Publishing: https://learn.microsoft.com/en-us/nuget/nuget-org/trusted-publishing
        The NUGET_TRUSTED_PUBLISHING_USERNAME contains the username that should have the trusted policy configured on nuget.org.
        If this user is no longer part of the datadog organisation on nuget.org: create a new trusted policy using your nuget user
          1. Create a new trusted policy using your nuget user. Follow the example in https://github.com/DataDog/dd-trace-dotnet/pull/8209
             If the policy is restricted to staging only, only nuget_publish_mode=stage works.
          2. Replace the NUGET_TRUSTED_PUBLISHING_USERNAME secret on the publish-debug-symbols-env environment with your nuget.org username (not email) at https://github.com/DataDog/dd-trace-dotnet/settings/environments
          3. Try running this release again
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set SHA
        id: set_sha
        run: |
          if [ -z "${{ inputs.forced_commit_id }}" ]; then
              commitsha="${GITHUB_SHA}"
          else
              commitsha="${{ inputs.forced_commit_id }}"
          fi
          echo "Using sha $commitsha"
          echo "sha=${commitsha}" >> $GITHUB_OUTPUT

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: "Configure Git Credentials"
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"

      # When pushing directly (not staging), check the NuGet credentials work before doing anything
      # else, as the packages are only pushed after the draft release is created. When staging,
      # the staging step below does this job, as it runs before anything modifies GitHub.
      # Use the ambient GitHub token to login to NuGet and retrieve an API key. Each NuGet step logs
      # in just before it needs a key, so the short-lived key is never held across other steps.
      - name: NuGet login for token check (OIDC → temp API key)
        if: ${{ !inputs.stage_nuget_packages }}
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: nuget_login_check
        with:
          # Secret is your NuGet username (not email), e.g. andrewlock
          user: ${{ secrets.NUGET_TRUSTED_PUBLISHING_USERNAME }}

      - name: "Check NuGet token validity"
        if: ${{ !inputs.stage_nuget_packages }}
        env:
          NUGET_API_KEY: ${{ steps.nuget_login_check.outputs.NUGET_API_KEY }}
        run: |
          echo "Downloading test package"
          if ! curl -fL -o Datadog.Trace.Annotations.1.0.0.nupkg https://www.nuget.org/api/v2/package/Datadog.Trace.Annotations/1.0.0; then
            echo "Download failed!" >&2
            exit 1
          fi

          echo "Pushing package to test NuGet API key validity"
          if ! dotnet nuget push "Datadog.Trace.Annotations.1.0.0.nupkg" --api-key "$NUGET_API_KEY" --skip-duplicate --source https://api.nuget.org/v3/index.json; then
            echo "Push failed - there is likely an issue with authentication." >&2
            echo "$NUGET_AUTH_HELP" >&2
            exit 1
          fi

          echo "Push succeeded, cleaning up"
          rm Datadog.Trace.Annotations.1.0.0.nupkg

      - name: Get GitHub Token via dd-octo-sts
        id: generate-token
        uses: DataDog/dd-octo-sts-action@c85802a58e202b7e764b5441e4378c76043c8108 # v1.0.5
        with:
          scope: DataDog/dd-trace-dotnet
          policy: self.github.create-draft-release

      - name: "Check GitLab status"
        if: ${{ !inputs.ignore_gitlab_failures }}
        run: ./tracer/build.sh VerifyReleaseReadiness
        env:
          CommitSha: "${{ steps.set_sha.outputs.sha }}"
          GITHUB_TOKEN: "${{ steps.generate-token.outputs.token }}"

      - name: "Get current version"
        id: versions
        run: ./tracer/build.sh OutputCurrentVersionToGitHub

      - name: "Verify this is not a dev build"
        env:
          FULL_VERSION: ${{ steps.versions.outputs.full_version }}
          VERSION_SUFFIX: ${{ steps.versions.outputs.version_suffix }}
        run: |
          if [ -n "$VERSION_SUFFIX" ] && [ "$VERSION_SUFFIX" != "-prerelease" ]; then
            echo "::error::Refusing to release $FULL_VERSION: only an empty or '-prerelease' version suffix can be released"
            exit 1
          fi

      - name: "Download build assets from Azure Pipelines"
        id: assets
        run: ./tracer/build.sh DownloadReleaseArtifacts
        env:
          TargetBranch: ${{ github.ref }}
          CommitSha: "${{ steps.set_sha.outputs.sha }}"
          GITHUB_TOKEN: "${{ steps.generate-token.outputs.token }}"
          AZURE_DEVOPS_TOKEN: "${{ secrets.AZURE_DEVOPS_TOKEN }}"

      # Staging runs before anything that modifies GitHub (milestones, the draft release), so an
      # authentication or validation failure aborts the release without side effects.
      #
      # Staged packages are validated by nuget.org, but are NOT visible or restorable until someone
      # promotes the staging group on nuget.org (website only, requires 2FA). Promote the group
      # BEFORE publishing the GitHub release. verify_nuget_release.yml alerts Slack if a published
      # release's packages aren't available on nuget.org.
      # See https://devblogs.microsoft.com/dotnet/nuget-staged-publishing/
      - name: NuGet login for staging (OIDC → temp API key)
        if: ${{ inputs.stage_nuget_packages }}
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: nuget_login_stage
        with:
          # Secret is your NuGet username (not email), e.g. andrewlock
          user: ${{ secrets.NUGET_TRUSTED_PUBLISHING_USERNAME }}

      - name: "Stage nuget packages on nuget.org"
        if: ${{ inputs.stage_nuget_packages }}
        working-directory: ${{steps.assets.outputs.artifacts_path}}
        env:
          NUGET_API_KEY: ${{ steps.nuget_login_stage.outputs.NUGET_API_KEY }}
          FULL_VERSION: ${{ steps.versions.outputs.full_version }}
        run: |
          set -euo pipefail

          # *.nupkg doesn't match *.snupkg; sibling symbol packages are staged automatically
          shopt -s nullglob
          packages=(*.nupkg)
          if [ ${#packages[@]} -eq 0 ]; then
            echo "::error::No .nupkg files found in $(pwd)"
            exit 1
          fi

          # verify_nuget_release.yml rebuilds this name as dd-trace-dotnet-<tag> (the tag is v<version>)
          group="dd-trace-dotnet-v${FULL_VERSION}"
          for pkg in "${packages[@]}"; do
            echo "Staging $pkg in group $group"
            # 'stage push' has no --skip-duplicate. Treat a conflict as success so the
            # workflow can be re-run after a partial failure.
            if output=$(dotnet package stage push "$pkg" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --group "$group" 2>&1); then
              echo "$output"
            # Use a here-string, not echo | grep -q: with pipefail, an early grep exit can SIGPIPE echo
            elif grep -qE '\b409\b|Conflict' <<<"$output"; then
              echo "$output"
              echo "::warning::$pkg was already uploaded (409 Conflict), assuming it was staged by a previous run"
            else
              echo "$output" >&2
              echo "Staging failed - if this is an authentication issue:" >&2
              echo "$NUGET_AUTH_HELP" >&2
              exit 1
            fi
          done

          {
            echo "## :warning: NuGet packages are staged, not published"
            echo ""
            echo "The following packages were uploaded to the nuget.org staging group \`$group\`."
            echo "They are **not** available to customers until the group is promoted."
            echo ""
            for pkg in "${packages[@]}"; do
              echo "- \`$pkg\`"
            done
            echo ""
            echo "**Before publishing the GitHub release:**"
            echo "1. Sign in to https://www.nuget.org (2FA required) and open the staging page in package management"
            echo "2. Wait for every package in \`$group\` to pass validation, then click **Promote group**"
            echo "3. Wait for the packages to become restorable, then publish the draft GitHub release"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "Generate release notes"
        id: release_notes
        run: ./tracer/build.sh GenerateReleaseNotes
        env:
          GITHUB_TOKEN: "${{ steps.generate-token.outputs.token }}"

      - name: "Rename vNext milestone"
        id: rename
        # We don't rename vNext/vNext-v1 for hotfix releases
        if: ${{ !inputs.is_hotfix }}
        run: ./tracer/build.sh RenameVNextMilestone
        env:
          GITHUB_TOKEN: "${{ steps.generate-token.outputs.token }}"

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          token: "${{ steps.generate-token.outputs.token }}"
          draft: true
          name: "${{steps.versions.outputs.full_version}}"
          tag_name: "v${{steps.versions.outputs.full_version}}"
          target_commitish: "${{steps.set_sha.outputs.sha}}"
          prerelease: ${{steps.versions.outputs.isprerelease}}
          body: ${{steps.release_notes.outputs.release_notes}}
          fail_on_unmatched_files: true
          files: |
            ${{steps.assets.outputs.artifacts_path}}/*.deb
            ${{steps.assets.outputs.artifacts_path}}/*.rpm
            ${{steps.assets.outputs.artifacts_path}}/*.tar.gz
            ${{steps.assets.outputs.artifacts_path}}/*.zip
            ${{steps.assets.outputs.gitlab_artifacts_path}}/*.msi
            ${{steps.assets.outputs.gitlab_artifacts_path}}/*.zip
            ${{steps.assets.outputs.sha_path}}

      # Fallback when not staging: publishes the packages immediately. Logs in again rather than
      # reusing the token-check key, which was issued before the artifact download.
      - name: NuGet login for push (OIDC → temp API key)
        if: ${{ !inputs.stage_nuget_packages }}
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: nuget_login_push
        with:
          # Secret is your NuGet username (not email), e.g. andrewlock
          user: ${{ secrets.NUGET_TRUSTED_PUBLISHING_USERNAME }}

      - name: "Publish nuget packages to nuget.org"
        if: ${{ !inputs.stage_nuget_packages }}
        working-directory: ${{steps.assets.outputs.artifacts_path}}
        env:
          NUGET_API_KEY: ${{ steps.nuget_login_push.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "*.nupkg" --skip-duplicate --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json

      - name: "Copy gitlab artifacts to artifacts_path"
        run: cp "${{steps.assets.outputs.gitlab_artifacts_path}}/"*.zip "${{steps.assets.outputs.artifacts_path}}/"

      - name: 'Push debug symbols to datadog'
        uses: ./.github/actions/publish-debug-symbols
        with:
          artifacts_path: ${{steps.assets.outputs.artifacts_path}}