name: Revert 'dev' version suffix before merging

# prepare_dev_build.yml stamps a feature branch with a dev version (X.Y.Z-dev.<suffix>). That commit must
# be reverted before the branch is merged, and this check is the reminder.

on:
  pull_request:
    branches:
      - master
      - main
      - 'release/**'
      - 'hotfix/**'

jobs:
  verify_version_suffix:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: "Get current version"
        id: versions
        run: ./tracer/build.sh OutputCurrentVersionToGitHub

      - name: "Verify the version suffix"
        env:
          FULL_VERSION: ${{ steps.versions.outputs.full_version }}
          VERSION_SUFFIX: ${{ steps.versions.outputs.version_suffix }}
        run: |
          if [ -n "$VERSION_SUFFIX" ] && [ "$VERSION_SUFFIX" != "-prerelease" ]; then
            echo "::error::The version is $FULL_VERSION. Revert the commit that set the '$VERSION_SUFFIX' version suffix (from the 'Prepare dev build' workflow) before merging."
            exit 1
          fi

          echo "Version $FULL_VERSION is valid for a release branch"
