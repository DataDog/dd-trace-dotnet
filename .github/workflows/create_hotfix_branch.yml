name: Create hotfix branch

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Hotfix Version Number (x.x.x)'
        required: true
      is_prerelease:
        description: 'Is Prerelease version? (true/false)'
        default: 'false'
        required: true

jobs:
  check_tag:
    runs-on: ubuntu-latest
    steps:
        - name: Verify running from a tag
          run: |
            if [[ "${{  github.ref }}" != refs/tags/* ]]; then
              echo "Error: This workflow can only be run from a tag"
              echo "Current ref: ${{ github.ref }}"
              exit 1
            fi

  bump_version:
    needs: check_tag
    # commit-headless does not support Windows runners.
    runs-on: ubuntu-latest
    permissions:
      contents: write # Push branches
      issues: write # change milestones 
    env:
      GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
      NewVersion: "${{ github.event.inputs.version }}"
      NewIsPrerelease: "${{ github.event.inputs.is_prerelease }}"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: "Bump Version"
        run: ./tracer/build.sh UpdateVersion

      - name: "Verify Changes"
        id: changes
        run: ./tracer/build.sh VerifyChangedFilesFromVersionBump -ExpectChangelogUpdate false

      - name: "Output Version"
        id: versions
        run: ./tracer/build.sh OutputCurrentVersionToGitHub

      - name: "Stage version bump"
        run: git add .

      - name: "Push hotfix branch"
        uses: DataDog/commit-headless@79367f840e221d63cb28a359de97833cdfde81dd # action/v3.4.0
        with:
          command: commit
          branch: hotfix/${{ steps.versions.outputs.full_version }}
          message: "[Version Bump] ${{ steps.versions.outputs.full_version }}"
          # Keeps whoever dispatched the workflow as a Co-authored-by trailer.
          author: "${{ github.actor }} <${{ github.actor }}@users.noreply.github.com>"
          head-sha: ${{ github.sha }}
          create-branch: true
