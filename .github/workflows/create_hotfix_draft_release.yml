name: Create hotfix draft release

on:
  workflow_dispatch:
    inputs:
      forced_commit_id:
        description: 'Force using artifacts from specific commit? If provided, this will try and use the artifacts from the given commit, regardless of build status'
        required: false
        type: string
      ignore_gitlab_failures:
        description: "DANGER Force ignoring any issues with the GitLab artifacts or SSI. Don't use this unless you _really_ know what you're doing"
        required: false
        type: boolean
        default: false
      nuget_publish_mode:
        description: "How to publish the NuGet packages. stage: upload to a nuget.org staging group, which you must promote on nuget.org before publishing the GitHub release. push: publish to nuget.org immediately (fallback)"
        required: false
        type: choice
        options:
          - stage
          - push
        default: stage

jobs:
    check_branch:
        runs-on: ubuntu-latest
        steps:
            - name: Verify running on hotfix branch
              run: |
                if [[ "${{  github.ref }}" != refs/heads/hotfix* ]]; then
                  echo "Error: This workflow can only be run from a hotfix/* branch"
                  echo "Current branch: ${{ github.ref }}"
                  exit 1
                fi

    create_hotfix_draft_release:
        needs: check_branch
        uses: ./.github/workflows/_create_draft_release.yml
        # All GitHub API access in the reusable workflow goes through the dd-octo-sts token; see
        # .github/chainguard/self.github.create-draft-release.sts.yaml
        permissions:
          contents: read # actions/checkout uses the workflow token to clone
          id-token: write # required for dd-octo-sts OIDC and NuGet trusted publishing
        # Must be declared here (even though the real values come from the reusable
        # workflow's `environment: publish-debug-symbols-env` secrets) - the environment
        # secret only overrides a name already known to the called workflow's secrets
        # context; it doesn't get exposed on its own. See _create_draft_release.yml.
        secrets:
            AZURE_DEVOPS_TOKEN: ${{ secrets.AZURE_DEVOPS_TOKEN }}
            NUGET_TRUSTED_PUBLISHING_USERNAME: ${{ secrets.NUGET_TRUSTED_PUBLISHING_USERNAME }}
        with:
            forced_commit_id: ${{ inputs.forced_commit_id }}
            ignore_gitlab_failures: ${{ inputs.ignore_gitlab_failures }}
            # Compare against push, so anything unexpected falls back to the safer staging behaviour
            stage_nuget_packages: ${{ inputs.nuget_publish_mode != 'push' }}
            is_hotfix: true
