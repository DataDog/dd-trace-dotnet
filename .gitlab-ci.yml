include:
  # Pipeline trigger tokens are reserved for the temporary Azure-to-GitLab
  # Windows signing bridge. All regular pipelines keep using the existing config.
  - local: .gitlab/azure-windows-signing.yml
    rules:
      - if: '$CI_PIPELINE_SOURCE == "trigger"'
  - local: .gitlab/regular.gitlab-ci.yml
    rules:
      - if: '$CI_PIPELINE_SOURCE != "trigger"'
