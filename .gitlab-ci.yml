stages:
  - build
  - test
  - publish
  - package
  - shared-pipeline-build
  - shared-pipeline-test
  - shared-pipeline-publish
  - publish
  - benchmarks
  # These benchmarks are running in parallel with the legacy ones
  - dotnet-aspnet-realworld-parallel
  - dotnet-aspnet-realworld-parallel-slo

include:
  - local: .gitlab/one-pipeline.locked.yml
  # MIGRATION TOUCHPOINT (GitHub org / GitLab group split):
  # GitLab does not expand top-level `variables:` inside `include:` keywords,
  # so we cannot parameterize this group path the way we do for trigger jobs
  # and scripts below. Update this line by hand at org-split cutover.
  - project: 'DataDog/apm-reliability/apm-sdks-benchmarks'
    file: '.gitlab/ci-dotnet-aspnet-realworld-parallel.yml'
    ref: 'main'

variables:
  DOTNET_PACKAGE_VERSION:
    description: "Used by the package stage when triggered manually"
  run_all_test_frameworks:
    value: "false"
    options:
      - "false"
      - "true"
    description: "Run unit tests against all supported target frameworks."
  perform_comprehensive_testing:
    value: "false"
    options:
      - "false"
      - "true"
    description: "Include minor package versions in multi-version sample builds."
  REPO_NOTIFICATION_CHANNEL: "#apm-dotnet-bots"
  # GitLab org for internal cross-repo references - parameterized for org migration resilience
  GITLAB_GROUP: DataDog
  # GitLab group path for OSS projects in CI - may differ from GITLAB_GROUP after org split
  GITLAB_GROUP_OSS: DataDog
  # GitHub org for internal repos (used in git insteadOf redirects) - update to new org after the split
  GITHUB_ORG_INTERNAL: DataDog
  CI_IDENTITIES_CLIENT_URL: s3://binaries-ddbuild-io-prod/ci-identities/ci-identities-gitlab-job-client/versions/v0.6.3/ci-identities-gitlab-job-client-windows-amd64.exe
  SUPPORTED_CONFIG_PATH: "tracer/src/Datadog.Trace/Configuration/supported-configurations.yaml"
  OCI_PACKAGE_MAX_SIZE_BYTES: 43000000
  LIB_INJECTION_IMAGE_MAX_SIZE_BYTES: 43000000
  SLS_CI_BRANCH: main
  WINDOWS_BUILD_IMAGE_BASE: "registry.ddbuild.io/ci/dd-trace-dotnet/dd-trace-dotnet-docker-build"

build-windows-ci-image:
  stage: build
  timeout: 2h
  tags: ["windows-v2:2022"]
  when: manual
  hooks:
    pre_get_sources_script:
      - git config --system core.longpaths true
  script:
    - |
      $hash = & tracer/build/_build/docker/gitlab/compute-image-hash.ps1
      if ($LASTEXITCODE -ne 0 -or $hash -notmatch '^[0-9a-f]{12}$') {
        throw "compute-image-hash.ps1 did not produce a valid hash (exit=$LASTEXITCODE, output='$hash')"
      }
      $base = $env:WINDOWS_BUILD_IMAGE_BASE
      $image = "${base}:${hash}"
      Write-Output "Target image: $image"

      docker manifest inspect $image
      if ($LASTEXITCODE -eq 0) {
        Write-Output "Image $image already exists in the registry - skipping rebuild."
        exit 0
      }
      Write-Output "Image does not exist yet - building."

      docker pull "${base}:latest"
      docker build --cache-from "${base}:latest" `
        -f tracer/build/_build/docker/gitlab/gitlab.windows.dockerfile `
        --tag $image `
        --tag "${base}:latest" `
        tracer/build/_build/docker/gitlab
      if ($LASTEXITCODE -ne 0) { throw "docker build failed" }

      docker push $image
      if ($LASTEXITCODE -ne 0) { throw "docker push $image failed" }

      docker push "${base}:latest"
      if ($LASTEXITCODE -ne 0) { throw "docker push ${base}:latest failed" }
  id_tokens:
    CI_IDENTITIES_GITLAB_ID_TOKEN:
      aud: ci-identities

generate-unit-tests-pipelines:
  except:
    variables:
      - $DEPLOY_TO_REL_ENV == "true"
      - $CI_COMMIT_TAG
  stage: build
  timeout: 15m
  tags: ["windows-v2:2022"]
  hooks:
    pre_get_sources_script:
      - git config --system core.longpaths true
  script:
    - |
      $hash = & tracer/build/_build/docker/gitlab/compute-image-hash.ps1
      if ($LASTEXITCODE -ne 0 -or $hash -notmatch '^[0-9a-f]{12}$') {
        throw "compute-image-hash.ps1 did not produce a valid hash (exit=$LASTEXITCODE, output='$hash')"
      }
      $env:WINDOWS_BUILD_IMAGE = "${env:WINDOWS_BUILD_IMAGE_BASE}:${hash}"

      docker manifest inspect $env:WINDOWS_BUILD_IMAGE
      if ($LASTEXITCODE -ne 0) {
        throw "Windows build image not found at $env:WINDOWS_BUILD_IMAGE"
      }

      $targetBranch = if ($env:CI_MERGE_REQUEST_TARGET_BRANCH_NAME) {
        $env:CI_MERGE_REQUEST_TARGET_BRANCH_NAME
      } else {
        $env:CI_DEFAULT_BRANCH
      }

      if (-not $targetBranch) {
        throw "Unable to determine the target branch for GitLab matrix generation"
      }

      # Mirror NUKE's thorough-testing checks before passing the decision to the
      # focused child-pipeline generator in the Windows image.
      git fetch --no-tags origin "+refs/heads/${targetBranch}:refs/remotes/origin/${targetBranch}"
      if ($LASTEXITCODE -ne 0) {
        throw "Failed to fetch target branch '$targetBranch' for matrix generation"
      }

      $changedFiles = @(git diff --name-only "origin/${targetBranch}...HEAD")
      if ($LASTEXITCODE -ne 0) {
        throw "Failed to find changes relative to '$targetBranch' for matrix generation"
      }

      $hasIntegrationChanges = $changedFiles | Where-Object {
        $path = $_.Replace('\', '/')
        $path -like "tracer/src/Datadog.Trace/Generated/*/Datadog.Trace.SourceGenerators/Datadog.Trace.SourceGenerators.InstrumentationDefinitions.InstrumentationDefinitionsGenerator*" `
          -or $path -like "tracer/src/Datadog.Trace/Generated/*/Datadog.Trace.SourceGenerators/AspectsDefinitionsGenerator*" `
          -or $path -like "tracer/src/Datadog.Trace/ClrProfiler/AutoInstrumentation/*" `
          -or $path -like "tracer/src/Datadog.Trace/Iast/Aspects/*"
      }
      $snapshotChangeCount = @($changedFiles | Where-Object { $_ -like "*verified.txt" }).Count

      $forceAllFrameworks = $env:run_all_test_frameworks -eq "true" -or $env:RUN_ALL_TEST_FRAMEWORKS -eq "true"
      $isMainlineBranch = $env:CI_COMMIT_BRANCH -in @("master", "main") `
                       -or $env:CI_COMMIT_BRANCH -like "release/*" `
                       -or $env:CI_COMMIT_BRANCH -like "hotfix/*"
      $includeAllFrameworks = $forceAllFrameworks `
                           -or ($isMainlineBranch -and $env:CI_PIPELINE_SOURCE -ne "schedule") `
                           -or [bool]$hasIntegrationChanges `
                           -or $snapshotChangeCount -gt 100

      Write-Output "Generating Windows, Linux, and macOS unit-test child pipelines (target=$targetBranch, includeAll=$includeAllFrameworks)"
      docker run --rm -m 20480M `
        -v "$(Get-Location):c:\mnt" `
        -e CI=true `
        -e CI_JOB_ID=${CI_JOB_ID} `
        -e CI_COMMIT_BRANCH `
        -e CI_MERGE_REQUEST_SOURCE_BRANCH_NAME `
        -e CI_PROJECT_NAME `
        -e CI_JOB_NAME_SLUG `
        -e AWS_NETWORKING=true `
        -e WINDOWS_BUILDER=true `
        -e NUGET_CERT_REVOCATION_MODE=offline `
        -e CI_IDENTITIES_GITLAB_ID_TOKEN `
        --entrypoint cmd.exe `
        $env:WINDOWS_BUILD_IMAGE `
        /d /s /c `
        "c:\entrypoint.bat GenerateGitlabWindowsUnitTestsPipeline GenerateGitlabLinuxUnitTestsPipeline GenerateGitlabLinuxArm64UnitTestsPipeline GenerateGitlabMacosUnitTestsPipeline --IncludeAllTestFrameworks $includeAllFrameworks"
      if ($LASTEXITCODE -ne 0) {
        throw "GitLab child-pipeline generation exited with code $LASTEXITCODE"
      }
  artifacts:
    expire_in: 2 weeks
    paths:
      - .gitlab/generated/windows-unit-tests.yml
      - .gitlab/generated/linux-unit-tests.yml
      - .gitlab/generated/linux-arm64-unit-tests.yml
      - .gitlab/generated/macos-unit-tests.yml
  id_tokens:
    CI_IDENTITIES_GITLAB_ID_TOKEN:
      aud: ci-identities

.build-linux-tracer:
  except:
    variables:
      - $DEPLOY_TO_REL_ENV == "true"
      - $CI_COMMIT_TAG
  stage: build
  # Approved Docker CLI image also used by dd-trace-java image-building jobs.
  image: 486234852809.dkr.ecr.us-east-1.amazonaws.com/docker:27.3.1
  timeout: 90m
  needs: []
  variables:
    DOCKER_BUILDKIT: "1"
  script:
    - |
      set -eu

      managed_image="dd-trace-dotnet/${MANAGED_BASE_IMAGE}-builder:${CI_JOB_ID}"
      native_image="dd-trace-dotnet/${NATIVE_BASE_IMAGE}-builder:${CI_JOB_ID}"

      echo "Building ${MANAGED_BASE_IMAGE} .NET ${MANAGED_DOTNET_SDK_VERSION} builder image"
      docker build \
        --build-arg "DOTNETSDK_VERSION=${MANAGED_DOTNET_SDK_VERSION}" \
        --tag "$managed_image" \
        --target builder \
        --file "tracer/build/_build/docker/${MANAGED_BASE_IMAGE}.dockerfile" \
        tracer/build/_build

      if [ "$NATIVE_BASE_IMAGE" = "$MANAGED_BASE_IMAGE" ] && [ "$NATIVE_DOTNET_SDK_VERSION" = "$MANAGED_DOTNET_SDK_VERSION" ]; then
        native_image="$managed_image"
      else
        echo "Building ${NATIVE_BASE_IMAGE} .NET ${NATIVE_DOTNET_SDK_VERSION} native builder image"
        docker build \
          --build-arg "DOTNETSDK_VERSION=${NATIVE_DOTNET_SDK_VERSION}" \
          --tag "$native_image" \
          --target builder \
          --file "tracer/build/_build/docker/${NATIVE_BASE_IMAGE}.dockerfile" \
          tracer/build/_build
      fi

      run_nuke() {
        image="$1"
        shift

        docker run --rm \
          --cap-add=SYS_PTRACE \
          --mount "type=bind,source=${CI_PROJECT_DIR},target=/project" \
          --env NugetPackageDirectory=/project/packages \
          --env artifacts=/project/artifacts/output \
          --env CI=true \
          --env CI_JOB_ID \
          --env CI_PROJECT_NAME \
          --env CI_JOB_NAME_SLUG \
          --env CI_COMMIT_SHA \
          --env CI_COMMIT_BRANCH \
          --env DD_LOGGER_DD_API_KEY \
          --env NUKE_TELEMETRY_OPTOUT=1 \
          --env NUGET_ENABLE_EXPERIMENTAL_HTTP_RETRY=true \
          "$image" \
          dotnet /build/bin/Debug/_build.dll "$@"
      }

      run_nuke "$managed_image" Clean CompileManagedLoader
      if [ "$RUN_NATIVE_TESTS" = "true" ]; then
        run_nuke "$native_image" BuildNativeTracerHome CompileTracerNativeTests RunTracerNativeTests
      else
        run_nuke "$native_image" BuildNativeTracerHome
      fi
      run_nuke "$managed_image" BuildManagedTracerHome ExtractDebugInfoLinux ValidateNativeTracerGlibcCompatibility
  artifacts:
    when: always
    expire_in: 2 weeks
    paths:
      - artifacts/bin
      - artifacts/monitoring-home
      - artifacts/native-symbols
      - artifacts/obj/**/ref/**/*
      - artifacts/obj/**/refint/**/*
      - artifacts/obj/Datadog.Trace.Tools.dd_dotnet/**/apphost
      - artifacts/build_data/tests
      - artifacts/build_data/logs
      - artifacts/build_data/dumps
    reports:
      junit:
        - artifacts/build_data/tests/*.xml

