  needs: [ download-single-step-artifacts ]

generate-lib-init-pinned-tag-values:
  variables:
    ADDITIONAL_TAG_SUFFIXES: musl #add -musl to all generated image tags

configure_system_tests:
  variables:
    SYSTEM_TESTS_SCENARIOS_GROUPS: "simple_onboarding,simple_onboarding_profiling,simple_onboarding_appsec,lib-injection"

deploy_to_reliability_env:
  rules:
    - when: never # dd-trace-dotnet does not use reliability environment

download-serverless-artifacts:
  stage: package
  image: registry.ddbuild.io/images/ci/images:1.2.6
  tags: [ "arch:amd64" ]
  needs: []
  rules:
    - if: $DOTNET_PACKAGE_VERSION
      when: on_success
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+(-prerelease)?$/'
      when: on_success # Artifacts are downloaded from the GitHub release, which creates the tag on publish
      allow_failure: false
    - when: delayed # Artifacts come from Azure pipeline, wait a reasonable time before polling
      start_in: 15 minutes
  script:
    - .gitlab/download-serverless-artifacts.sh
  artifacts:
    expire_in: 2 weeks
    paths:
      - artifacts

aws-lambda-layer:
  stage: package
  needs: [download-serverless-artifacts]
  when: manual
  trigger:
    project: ${GITLAB_GROUP_OSS}/dd-trace-dotnet-aws-lambda-layer
    strategy: depend
  variables:
    UPSTREAM_PIPELINE_ID: $CI_PIPELINE_ID
    UPSTREAM_PIPELINE_REF: $CI_COMMIT_REF_NAME
  allow_failure: true

benchmark-serverless:
  stage: benchmarks
  image: registry.ddbuild.io/ci/serverless-tools:1
  tags: ["arch:amd64"]
  when: on_success
  needs:
    - benchmark-serverless-trigger
  script:
    - curl -OL "https://binaries.ddbuild.io/dd-source/authanywhere/LATEST/authanywhere-linux-amd64" 
    - mv "authanywhere-linux-amd64" /bin/authanywhere 
    - chmod +x /bin/authanywhere
    - BTI_CI_API_TOKEN=$(authanywhere --audience rapid-devex-ci)
    - >-
      BTI_RESPONSE=$(curl --silent --request GET \
        --header "$BTI_CI_API_TOKEN" \  --header "Content-Type: application/vnd.api+json" \
        "https://bti-ci-api.us1.ddbuild.io/internal/ci/gitlab/token?owner=${GITLAB_GROUP}&repository=serverless-tools")
    - GITLAB_TOKEN=$(echo "$BTI_RESPONSE" | jq -r '.token // empty')
    - git clone https://gitlab-ci-token:${GITLAB_TOKEN}@gitlab.ddbuild.io/${GITLAB_GROUP}/serverless-tools.git ./serverless-tools
    - cd ./serverless-tools
    - ./ci/check_trigger_status.sh

benchmark-serverless-trigger:
  stage: benchmarks
  needs: []
  trigger:
    project: ${GITLAB_GROUP}/serverless-tools
    branch: $SLS_CI_BRANCH
    strategy: depend
  allow_failure: true
  variables:
    UPSTREAM_PIPELINE_ID: $CI_PIPELINE_ID
    UPSTREAM_PROJECT_URL: $CI_PROJECT_URL
    UPSTREAM_COMMIT_BRANCH: $CI_COMMIT_BRANCH
    UPSTREAM_COMMIT_AUTHOR: $CI_COMMIT_AUTHOR
    UPSTREAM_COMMIT_TITLE: $CI_COMMIT_TITLE
    UPSTREAM_COMMIT_TAG: $CI_COMMIT_TAG
    UPSTREAM_PROJECT_NAME: $CI_PROJECT_NAME
    UPSTREAM_GITLAB_USER_LOGIN: $GITLAB_USER_LOGIN
    UPSTREAM_GITLAB_USER_EMAIL: $GITLAB_USER_EMAIL
    # only available on Merge Requests
    UPSTREAM_MERGE_TARGET_BRANCH: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME
    DD_TAGS: "SLS_CI_BRANCH:$SLS_CI_BRANCH"

macrobenchmarks:
  stage: benchmarks
  needs: []
  trigger:
    include: .gitlab/benchmarks/macrobenchmarks.yml
  variables:
    # Forward BP_EXTERNAL_S3_URL so an external orchestrator can override the S3 destination.
    # This avoids 'forward: pipeline_variables: true', which forwards every parent variable and may be unsafe.
    # When the orchestrator leaves it unset, GitLab forwards the literal '$BP_EXTERNAL_S3_URL' (not empty),
    # so downstream code must treat that literal as unset.
    BP_EXTERNAL_S3_URL: $BP_EXTERNAL_S3_URL
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH =~ /^hotfix/)'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $BENCHMARK_RUN == "true"'
      when: always
    - when: manual

microbenchmarks:
  stage: benchmarks
  needs: []
  trigger:
    include: .gitlab/benchmarks/microbenchmarks.yml
    strategy: depend
  variables:
    # Forward BP_EXTERNAL_S3_URL so an external orchestrator can override the S3 destination.
    # This avoids 'forward: pipeline_variables: true', which forwards every parent variable and may be unsafe.
    # When the orchestrator leaves it unset, GitLab forwards the literal '$BP_EXTERNAL_S3_URL' (not empty),
    # so downstream code must treat that literal as unset.
    BP_EXTERNAL_S3_URL: $BP_EXTERNAL_S3_URL
  allow_failure: true
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: always

dsm_throughput:
  stage: benchmarks
  trigger:
    include: .gitlab/benchmarks/dsm-throughput.yml
  variables:
    # Forward BP_EXTERNAL_S3_URL so an external orchestrator can override the S3 destination.
    # This avoids 'forward: pipeline_variables: true', which forwards every parent variable and may be unsafe.
    # When the orchestrator leaves it unset, GitLab forwards the literal '$BP_EXTERNAL_S3_URL' (not empty),
    # so downstream code must treat that literal as unset.
    BP_EXTERNAL_S3_URL: $BP_EXTERNAL_S3_URL
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "master"'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $BENCHMARK_RUN == "true"'
      when: always
    - when: manual


validate_supported_configurations_v2_local_file:
  stage: build
  rules:
    - when: on_success
  extends: .validate_supported_configurations_v2_local_file
  variables:
    LOCAL_CONFIG_PATH: $SUPPORTED_CONFIG_PATH
    BACKFILLED: true
  
update_central_configurations_version_range_v2:
  extends: .update_central_configurations_version_range_v2
  variables:
    LOCAL_CONFIG_PATH: $SUPPORTED_CONFIG_PATH
    LANGUAGE_NAME: "dotnet"
    SEND_ALIASES: true
