.build-linux-profiler:
  except:
    variables:
      - $DEPLOY_TO_REL_ENV == "true"
      - $CI_COMMIT_TAG
  stage: build
  image: 486234852809.dkr.ecr.us-east-1.amazonaws.com/docker:27.3.1
  timeout: 90m
  needs: []
  variables:
    DOCKER_BUILDKIT: "1"
  script:
    - |
      set -eu

      native_image="dd-trace-dotnet/${NATIVE_BASE_IMAGE}-profiler-builder:${CI_JOB_ID}"
      validation_image="dd-trace-dotnet/${VALIDATION_BASE_IMAGE}-profiler-validator:${CI_JOB_ID}"

      echo "Building ${NATIVE_BASE_IMAGE} .NET ${NATIVE_DOTNET_SDK_VERSION} profiler builder image"
      docker build \
        --build-arg "DOTNETSDK_VERSION=${NATIVE_DOTNET_SDK_VERSION}" \
        --tag "$native_image" \
        --target builder \
        --file "tracer/build/_build/docker/${NATIVE_BASE_IMAGE}.dockerfile" \
        tracer/build/_build

      if [ "$NATIVE_BASE_IMAGE" = "$VALIDATION_BASE_IMAGE" ] && [ "$NATIVE_DOTNET_SDK_VERSION" = "$VALIDATION_DOTNET_SDK_VERSION" ]; then
        validation_image="$native_image"
      else
        echo "Building ${VALIDATION_BASE_IMAGE} .NET ${VALIDATION_DOTNET_SDK_VERSION} profiler validation image"
        docker build \
          --build-arg "DOTNETSDK_VERSION=${VALIDATION_DOTNET_SDK_VERSION}" \
          --tag "$validation_image" \
          --target builder \
          --file "tracer/build/_build/docker/${VALIDATION_BASE_IMAGE}.dockerfile" \
          tracer/build/_build
      fi

      run_nuke() {
        image="$1"
        shift

        docker run --rm \
          --cap-add=SYS_PTRACE \
          --mount "type=bind,source=${CI_PROJECT_DIR},target=/project" \
          --env NugetPackageDirectory=/project/packages \
          --env artifacts=/project/artifacts/output \
          --env CI=true \
          --env CI_JOB_ID \
          --env CI_PROJECT_NAME \
          --env CI_JOB_NAME_SLUG \
          --env CI_COMMIT_SHA \
          --env CI_COMMIT_BRANCH \
          --env DD_LOGGER_DD_API_KEY \
          --env NUKE_TELEMETRY_OPTOUT=1 \
          --env NUGET_ENABLE_EXPERIMENTAL_HTTP_RETRY=true \
          "$image" \
          dotnet /build/bin/Debug/_build.dll "$@"
      }

      run_nuke "$native_image" \
        Clean BuildProfilerHome CompileNativeWrapper \
        CompileProfilerNativeTests RunProfilerNativeTests \
        CompileNativeWrapperNativeTests RunNativeWrapperNativeTests \
        CompileNativeLoaderNativeTests RunNativeLoaderNativeTests
      run_nuke "$validation_image" ExtractDebugInfoLinux ValidateNativeProfilerGlibcCompatibility
  artifacts:
    when: always
    expire_in: 2 weeks
    paths:
      - artifacts/monitoring-home
      - artifacts/native-symbols
      - artifacts/build_data/logs
      - artifacts/build_data/dumps
      - profiler/build_data/tests
    reports:
      junit:
        - profiler/build_data/tests/*.xml

