.macos-amd64:
  tags: ["macos:sonoma-amd64"]
  variables:
    DOTNET_SDK_VERSION: "10.0.100"
    DOTNET_CLI_HOME: "$CI_PROJECT_DIR/.dotnet_cli_home"
    NUGET_PACKAGES: "$CI_PROJECT_DIR/packages"
    NUGET_ENABLE_EXPERIMENTAL_HTTP_RETRY: "true"
    NUKE_TELEMETRY_OPTOUT: "1"
  before_script:
    - |
      set -eu
      export DOTNET_ROOT="${CI_PROJECT_DIR}/.dotnet"
      export PATH="${DOTNET_ROOT}:${PATH}"
      mkdir -p "$DOTNET_ROOT" "$DOTNET_CLI_HOME" "$NUGET_PACKAGES"

      dotnet_install_script="${TMPDIR:-/tmp}/dd-trace-dotnet-${CI_JOB_ID}-dotnet-install.sh"
      trap 'rm -f "$dotnet_install_script"' EXIT
      curl --fail --silent --show-error --location --retry 5 \
        --output "$dotnet_install_script" \
        https://github.com/dotnet/install-scripts/raw/2bdc7f2c6e00d60be57f552b8a8aab71512dbcb2/src/dotnet-install.sh
      bash "$dotnet_install_script" \
        --version "$DOTNET_SDK_VERSION" \
        --install-dir "$DOTNET_ROOT" \
        --no-path
      dotnet --info

build-macos-tracer-amd64:
  extends: .macos-amd64
  except:
    variables:
      - $DEPLOY_TO_REL_ENV == "true"
      - $CI_COMMIT_TAG
  stage: build
  timeout: 1h
  needs: []
  script:
    # Azure builds these pieces in two jobs and merges their artifacts. The GitLab
    # PoC keeps the same targets in one workspace and publishes the combined result.
    - ./tracer/build.sh Clean CreateRequiredDirectories CompileManagedLoader BuildNativeTracerHome --NugetPackageDirectory "$NUGET_PACKAGES"
    - ./tracer/build.sh BuildManagedTracerHome BuildNativeLoader --skip CreateTrimmingFile --NugetPackageDirectory "$NUGET_PACKAGES"
  artifacts:
    when: always
    expire_in: 2 weeks
    paths:
      - artifacts/bin
      - artifacts/monitoring-home
      - artifacts/obj/**/ref/**/*
      - artifacts/obj/**/refint/**/*
      - artifacts/obj/Datadog.Trace.Tools.dd_dotnet/**/apphost
      - artifacts/build_data/logs
      - artifacts/build_data/dumps

build:
  except:
    variables:
      - $DEPLOY_TO_REL_ENV == "true"
      - $CI_COMMIT_TAG # We don't need to build/publish when building a release tag
  stage: build
  timeout: 2h
  tags: ["windows-v2:2022"]
  hooks:
    pre_get_sources_script:
      - git config --system core.longpaths true
  script:
    - if (Test-Path build-out) { remove-item -recurse -force build-out }
    - if (Test-Path artifacts-out) { remove-item -recurse -force artifacts-out }
    - |
      $hash = & tracer/build/_build/docker/gitlab/compute-image-hash.ps1
      if ($LASTEXITCODE -ne 0 -or $hash -notmatch '^[0-9a-f]{12}$') {
        throw "compute-image-hash.ps1 did not produce a valid hash (exit=$LASTEXITCODE, output='$hash')"
      }
      $env:WINDOWS_BUILD_IMAGE = "${env:WINDOWS_BUILD_IMAGE_BASE}:${hash}"
      Write-Output "Expected Windows build image: $env:WINDOWS_BUILD_IMAGE"

      docker manifest inspect $env:WINDOWS_BUILD_IMAGE
      if ($LASTEXITCODE -ne 0) {
        Write-Host "ERROR: Windows build image not found at $env:WINDOWS_BUILD_IMAGE."
        Write-Host "The Dockerfile or install scripts under tracer/build/_build/docker/gitlab/ have changed."
        Write-Host "Manually trigger the 'build-windows-ci-image' job in this pipeline, wait for it to finish, then re-run this job."
        exit 1
      }
    - |
      try {
        $computerSystem = Get-CimInstance Win32_ComputerSystem
        $operatingSystem = Get-CimInstance Win32_OperatingSystem
        Write-Output ("Runner memory: {0:N1} GB total, {1:N1} GB free" -f ($computerSystem.TotalPhysicalMemory / 1GB), ($operatingSystem.FreePhysicalMemory * 1KB / 1GB))
        Write-Output "Runner logical processors: $($computerSystem.NumberOfLogicalProcessors)"
      } catch {
        Write-Warning "Unable to retrieve runner information: $_"
      }

      $containerName = "dd-trace-build-$env:CI_JOB_ID"
      $containerMemoryLimit = 20GB
      $dockerPath = (Get-Command docker).Source
      $statsJob = Start-Job -ArgumentList $containerName, $containerMemoryLimit, $dockerPath -ScriptBlock {
        param($name, $memoryLimit, $docker)

        function ConvertTo-Bytes([string] $value) {
          if ($value -notmatch '^\s*([0-9]+(?:\.[0-9]+)?)\s*([KMGT]?i?B)\s*$') {
            return $null
          }

          $factors = @{
            B   = 1
            KB  = 1KB
            KiB = 1KB
            MB  = 1MB
            MiB = 1MB
            GB  = 1GB
            GiB = 1GB
            TB  = 1TB
            TiB = 1TB
          }

          return [double]$Matches[1] * $factors[$Matches[2]]
        }

        $containerSeen = $false
        $peakBytes = 0.0
        $peakUsage = "unknown"

        while ($true) {
          $stats = & $docker stats $name --no-stream --format "{{.MemUsage}}" 2>$null
          if ($LASTEXITCODE -eq 0 -and $stats) {
            $containerSeen = $true
            $usage = ($stats -split '/', 2)[0].Trim()
            $usageBytes = ConvertTo-Bytes $usage
            if ($null -ne $usageBytes -and $usageBytes -gt $peakBytes) {
              $peakBytes = $usageBytes
              $peakUsage = $usage
            }
          } elseif ($containerSeen) {
            break
          }

          Start-Sleep -Seconds 5
        }

        $peakPercent = 100 * $peakBytes / $memoryLimit
        Write-Output ("Peak container memory: {0} ({1:N1}% of limit)" -f $peakUsage, $peakPercent)
      }

      # Enable MSVC /MP, capped at the runner's logical processor count.
      docker run --name $containerName --rm -m 20480M `
        -v "$(Get-Location):c:\mnt" `
        -e CI_JOB_ID=${CI_JOB_ID} `
        -e ENABLE_MULTIPROCESSOR_COMPILATION=true `
        -e CL_MPCount=16 `
        -e WINDOWS_BUILDER=true `
        -e AWS_NETWORKING=true `
        -e SIGN_WINDOWS=true `
        -e NUGET_CERT_REVOCATION_MODE=offline `
        -e CI_IDENTITIES_GITLAB_ID_TOKEN `
        -e CI_PROJECT_NAME `
        -e CI_JOB_NAME_SLUG `
        $env:WINDOWS_BUILD_IMAGE `
        Info Clean BuildTracerHome BuildProfilerHome BuildNativeLoader BuildDdDotnet `
        --NugetPackageDirectory c:\mnt\packages
      $buildExitCode = $LASTEXITCODE

      Wait-Job $statsJob -Timeout 15 | Out-Null
      if ($statsJob.State -eq 'Running') {
        Stop-Job $statsJob
      }

      Receive-Job $statsJob
      Remove-Job $statsJob -Force

      if ($buildExitCode -ne 0) {
        throw "Docker build container exited with code $buildExitCode"
      }
    - |
      # Run the native tests against the outputs from the build above, matching the
      # Azure pipeline's build-then-test flow in a shared working directory.
      docker run --rm -m 20480M `
        -v "$(Get-Location):c:\mnt" `
        -e CI_JOB_ID=${CI_JOB_ID} `
        -e ENABLE_MULTIPROCESSOR_COMPILATION=true `
        -e CL_MPCount=16 `
        -e WINDOWS_BUILDER=true `
        -e AWS_NETWORKING=true `
        -e NUGET_CERT_REVOCATION_MODE=offline `
        -e DD_LOGGER_DD_API_KEY `
        -e CI_IDENTITIES_GITLAB_ID_TOKEN `
        -e CI_PROJECT_NAME `
        -e CI_JOB_NAME_SLUG `
        $env:WINDOWS_BUILD_IMAGE `
        CompileTracerNativeTests RunTracerNativeTests `
        CompileNativeLoaderNativeTests RunNativeLoaderNativeTests `
        CompileProfilerNativeTests RunProfilerNativeTests `
        --NugetPackageDirectory c:\mnt\packages
      if ($LASTEXITCODE -ne 0) {
        throw "Native test container exited with code $LASTEXITCODE"
      }
    - |
      # Package and sign only after the native tests pass so the release outputs are
      # produced from the successfully tested build state.
      docker run --rm -m 20480M `
        -v "$(Get-Location):c:\mnt" `
        -e CI_JOB_ID=${CI_JOB_ID} `
        -e ENABLE_MULTIPROCESSOR_COMPILATION=true `
        -e CL_MPCount=16 `
        -e WINDOWS_BUILDER=true `
        -e AWS_NETWORKING=true `
        -e SIGN_WINDOWS=true `
        -e NUGET_CERT_REVOCATION_MODE=offline `
        -e CI_IDENTITIES_GITLAB_ID_TOKEN `
        -e CI_PROJECT_NAME `
        -e CI_JOB_NAME_SLUG `
        $env:WINDOWS_BUILD_IMAGE `
        PublishFleetInstaller PackageTracerHome ZipSymbols SignDlls SignMsi DownloadWinSsiTelemetryForwarder `
        --NugetPackageDirectory c:\mnt\packages
      if ($LASTEXITCODE -ne 0) {
        throw "Docker packaging container exited with code $LASTEXITCODE"
      }
    - mkdir artifacts-out
    - xcopy /e/s build-out\${CI_JOB_ID}\*.* artifacts-out
    - remove-item -recurse -force build-out\${CI_JOB_ID}
    - get-childitem build-out
    - get-childitem artifacts-out
  artifacts:
    when: always
    expire_in: 2 weeks
    paths:
    - artifacts-out
    # Inputs consumed by the parallel managed unit-test jobs. Each job restores its
    # own MSBuild obj files and builds only its requested test target framework.
    - artifacts/bin
    - artifacts/monitoring-home
    # `dotnet build --no-dependencies` resolves project references through these
    # intermediate reference assemblies, not through the final binaries above.
    - artifacts/obj/**/ref/**/*
    - artifacts/obj/**/refint/**/*
    # The dd_dotnet tests also copy the producer-built executable host.
    - artifacts/obj/Datadog.Trace.Tools.dd_dotnet/**/apphost.exe
    - artifacts/build_data/tests
    - artifacts/build_data/dumps
    - profiler/build_data/tests
    reports:
      junit:
        - artifacts/build_data/tests/*.xml
        - profiler/build_data/tests/*.xml
  id_tokens:
    CI_IDENTITIES_GITLAB_ID_TOKEN:
      aud: ci-identities

.windows-sample-build:
  except:
