# Non-blocking build/unit-test shadow; failures propagate to the optional parent trigger.
include:
  - local: .gitlab/linux-build-common.yml

variables:
  # CentOS/universal native toolchains cannot use the managed SDK from global.json.
  LEGACY_NATIVE_DOTNET_SDK_VERSION: "7.0.306"

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "parent_pipeline"'

stages:
  - build
  - test

generate-unit-tests-pipelines:
  stage: build
  timeout: 30m
  tags: ["windows-v2:2022"]
  needs: []
  variables:
    GIT_DEPTH: "0"
  hooks:
    pre_get_sources_script:
      - git config --system core.longpaths true
  script:
    - '& .gitlab/generate-unit-tests-pipelines.ps1'
  artifacts:
    expire_in: 2 weeks
    paths:
      - .gitlab/generated/windows-unit-tests.yml
      - .gitlab/generated/linux-unit-tests.yml
      - .gitlab/generated/linux-arm64-unit-tests.yml
  # Registry authentication on the host; do not forward into shadow containers.
  id_tokens:
    CI_IDENTITIES_GITLAB_ID_TOKEN:
      aud: ci-identities

build:
  stage: build
  timeout: 2h
  tags: ["windows-v2:2022"]
  needs: []
  hooks:
    pre_get_sources_script:
      - git config --system core.longpaths true
  script:
    - '& .gitlab/run-windows-build-unit-tests.ps1'
  artifacts:
    when: always
    expire_in: 2 weeks
    paths:
      - artifacts/bin
      - artifacts/monitoring-home
      - artifacts/obj/**/ref/**/*
      - artifacts/obj/**/refint/**/*
      - artifacts/obj/Datadog.Trace.Tools.dd_dotnet/**/apphost.exe
      - artifacts/build_data/tests
      - artifacts/build_data/logs
      - artifacts/build_data/dumps
      - profiler/build_data/tests
    reports:
      junit:
        - artifacts/build_data/tests/*.xml
        - profiler/build_data/tests/*.xml
  # Registry authentication on the host; do not forward into shadow containers.
  id_tokens:
    CI_IDENTITIES_GITLAB_ID_TOKEN:
      aud: ci-identities

.build-linux-tracer:
  extends: .linux-docker
  stage: build
  timeout: 90m
  needs: []
  script:
    - |
      set -eu

      MANAGED_DOTNET_SDK_VERSION=$(sh .gitlab/get-dotnet-sdk-version.sh)
      NATIVE_DOTNET_SDK_VERSION=${NATIVE_DOTNET_SDK_VERSION:-$MANAGED_DOTNET_SDK_VERSION}

      managed_image="dd-trace-dotnet/${MANAGED_BASE_IMAGE}-builder:${CI_JOB_ID}"
      native_image="dd-trace-dotnet/${NATIVE_BASE_IMAGE}-builder:${CI_JOB_ID}"

      echo "Building ${MANAGED_BASE_IMAGE} .NET ${MANAGED_DOTNET_SDK_VERSION} builder image"
      sh .gitlab/build-linux-image.sh "$MANAGED_BASE_IMAGE" "$MANAGED_DOTNET_SDK_VERSION" "$managed_image"

      if [ "$NATIVE_BASE_IMAGE" = "$MANAGED_BASE_IMAGE" ] && [ "$NATIVE_DOTNET_SDK_VERSION" = "$MANAGED_DOTNET_SDK_VERSION" ]; then
        native_image="$managed_image"
      else
        echo "Building ${NATIVE_BASE_IMAGE} .NET ${NATIVE_DOTNET_SDK_VERSION} native builder image"
        sh .gitlab/build-linux-image.sh "$NATIVE_BASE_IMAGE" "$NATIVE_DOTNET_SDK_VERSION" "$native_image"
      fi

      . .gitlab/run-nuke-linux.sh

      run_nuke "$managed_image" Clean CompileManagedLoader
      if [ "$RUN_NATIVE_TESTS" = "true" ]; then
        run_nuke "$native_image" BuildNativeTracerHome CompileTracerNativeTests RunTracerNativeTests
      else
        run_nuke "$native_image" BuildNativeTracerHome
      fi
      run_nuke "$managed_image" BuildManagedTracerHome ExtractDebugInfoLinux ValidateNativeTracerGlibcCompatibility
  artifacts:
    when: always
    expire_in: 2 weeks
    paths:
      - artifacts/bin
      - artifacts/monitoring-home
      - artifacts/native-symbols
      - artifacts/obj/**/ref/**/*
      - artifacts/obj/**/refint/**/*
      - artifacts/obj/Datadog.Trace.Tools.dd_dotnet/**/apphost
      - artifacts/build_data/tests
      - artifacts/build_data/logs
      - artifacts/build_data/dumps
    reports:
      junit:
        - artifacts/build_data/tests/*.xml

build-linux-tracer-x64:
  extends: .build-linux-tracer
  tags: ["docker-in-docker:amd64"]
  variables:
    MANAGED_BASE_IMAGE: debian
    NATIVE_BASE_IMAGE: centos7
    NATIVE_DOTNET_SDK_VERSION: "$LEGACY_NATIVE_DOTNET_SDK_VERSION"
    RUN_NATIVE_TESTS: "true"

build-linux-tracer-x64-musl:
  extends: .build-linux-tracer
  tags: ["docker-in-docker:amd64"]
  variables:
    MANAGED_BASE_IMAGE: alpine
    NATIVE_BASE_IMAGE: alpine
    RUN_NATIVE_TESTS: "true"

build-linux-tracer-arm64:
  extends: .build-linux-tracer
  tags: ["docker-in-docker:arm64"]
  variables:
    MANAGED_BASE_IMAGE: debian
    NATIVE_BASE_IMAGE: debian
    RUN_NATIVE_TESTS: "false"

build-linux-tracer-arm64-musl:
  extends: .build-linux-tracer
  tags: ["docker-in-docker:arm64"]
  variables:
    MANAGED_BASE_IMAGE: alpine
    NATIVE_BASE_IMAGE: alpine
    RUN_NATIVE_TESTS: "false"

.build-linux-profiler:
  extends: .linux-docker
  stage: build
  timeout: 90m
  needs: []
  script:
    - |
      set -eu

      VALIDATION_DOTNET_SDK_VERSION=$(sh .gitlab/get-dotnet-sdk-version.sh)
      NATIVE_DOTNET_SDK_VERSION=${NATIVE_DOTNET_SDK_VERSION:-$VALIDATION_DOTNET_SDK_VERSION}

      native_image="dd-trace-dotnet/${NATIVE_BASE_IMAGE}-profiler-builder:${CI_JOB_ID}"
      validation_image="dd-trace-dotnet/${VALIDATION_BASE_IMAGE}-profiler-validator:${CI_JOB_ID}"

      echo "Building ${NATIVE_BASE_IMAGE} .NET ${NATIVE_DOTNET_SDK_VERSION} profiler builder image"
      sh .gitlab/build-linux-image.sh "$NATIVE_BASE_IMAGE" "$NATIVE_DOTNET_SDK_VERSION" "$native_image"

      if [ "$NATIVE_BASE_IMAGE" = "$VALIDATION_BASE_IMAGE" ] && [ "$NATIVE_DOTNET_SDK_VERSION" = "$VALIDATION_DOTNET_SDK_VERSION" ]; then
        validation_image="$native_image"
      else
        echo "Building ${VALIDATION_BASE_IMAGE} .NET ${VALIDATION_DOTNET_SDK_VERSION} profiler validation image"
        sh .gitlab/build-linux-image.sh "$VALIDATION_BASE_IMAGE" "$VALIDATION_DOTNET_SDK_VERSION" "$validation_image"
      fi

      . .gitlab/run-nuke-linux.sh

      if [ "$RUN_NATIVE_TESTS" = "true" ]; then
        run_nuke "$native_image" \
          Clean BuildProfilerHome CompileNativeWrapper \
          CompileProfilerNativeTests RunProfilerNativeTests \
          CompileNativeWrapperNativeTests RunNativeWrapperNativeTests \
          CompileNativeLoaderNativeTests RunNativeLoaderNativeTests
      else
        run_nuke "$native_image" Clean BuildProfilerHome
      fi
      run_nuke "$validation_image" ExtractDebugInfoLinux ValidateNativeProfilerGlibcCompatibility
  artifacts:
    when: always
    expire_in: 2 weeks
    paths:
      - artifacts/monitoring-home
      - artifacts/native-symbols
      - artifacts/build_data/logs
      - artifacts/build_data/dumps
      - artifacts/build_data/tests
      - profiler/build_data/tests
    reports:
      junit:
        - artifacts/build_data/tests/*.xml
        - profiler/build_data/tests/*.xml

build-linux-profiler-x64:
  extends: .build-linux-profiler
  tags: ["docker-in-docker:amd64"]
  variables:
    NATIVE_BASE_IMAGE: centos7
    NATIVE_DOTNET_SDK_VERSION: "$LEGACY_NATIVE_DOTNET_SDK_VERSION"
    VALIDATION_BASE_IMAGE: debian
    RUN_NATIVE_TESTS: "true"

build-linux-profiler-x64-musl:
  extends: .build-linux-profiler
  tags: ["docker-in-docker:amd64"]
  variables:
    NATIVE_BASE_IMAGE: alpine
    VALIDATION_BASE_IMAGE: alpine
    RUN_NATIVE_TESTS: "true"

build-linux-profiler-arm64:
  extends: .build-linux-profiler
  tags: ["docker-in-docker:arm64"]
  variables:
    NATIVE_BASE_IMAGE: debian
    VALIDATION_BASE_IMAGE: debian
    RUN_NATIVE_TESTS: "false"

build-linux-profiler-arm64-musl:
  extends: .build-linux-profiler
  tags: ["docker-in-docker:arm64"]
  variables:
    NATIVE_BASE_IMAGE: alpine
    VALIDATION_BASE_IMAGE: alpine
    RUN_NATIVE_TESTS: "false"

.build-linux-universal:
  extends: .linux-docker
  stage: build
  timeout: 60m
  needs: []
  variables:
    UNIVERSAL_DOTNET_SDK_VERSION: "$LEGACY_NATIVE_DOTNET_SDK_VERSION"
  script:
    - |
      set -eu

      universal_image="dd-trace-dotnet/universal-${UNIVERSAL_ARCHITECTURE}-builder:${CI_JOB_ID}"
      echo "Building ${UNIVERSAL_ARCHITECTURE} universal .NET ${UNIVERSAL_DOTNET_SDK_VERSION} builder image"
      sh .gitlab/build-linux-image.sh universal "$UNIVERSAL_DOTNET_SDK_VERSION" "$universal_image"

      . .gitlab/run-nuke-linux.sh
      # Universal builds do not need CI Visibility credentials.
      unset DD_LOGGER_DD_API_KEY
      run_nuke "$universal_image" \
        Clean BuildNativeLoader BuildNativeWrapper ExtractDebugInfoLinux ValidateNativeLoaderSnapshotTestsLinux
  artifacts:
    when: always
    expire_in: 2 weeks
    paths:
      - artifacts/monitoring-home/linux-musl-${UNIVERSAL_ARCHITECTURE}
      - artifacts/native-symbols/linux-musl-${UNIVERSAL_ARCHITECTURE}
      - artifacts/build_data/logs
      - artifacts/build_data/dumps

build-linux-universal-x64:
  extends: .build-linux-universal
  tags: ["docker-in-docker:amd64"]
  variables:
    UNIVERSAL_ARCHITECTURE: x64

build-linux-universal-arm64:
  extends: .build-linux-universal
  tags: ["docker-in-docker:arm64"]
  variables:
    UNIVERSAL_ARCHITECTURE: arm64

unit-tests-windows:
  stage: test
  needs:
    - job: build
      artifacts: false
    - job: generate-unit-tests-pipelines
      artifacts: false
  trigger:
    include:
      - artifact: .gitlab/generated/windows-unit-tests.yml
        job: generate-unit-tests-pipelines
    strategy: depend
  variables:
    PARENT_PIPELINE_ID: $CI_PIPELINE_ID
    # Variables inherited from the root pipeline are not automatically forwarded again.
    WINDOWS_BUILD_IMAGE_BASE: $WINDOWS_BUILD_IMAGE_BASE

unit-tests-linux-x64:
  stage: test
  needs:
    - job: build-linux-tracer-x64
      artifacts: false
    - job: build-linux-tracer-x64-musl
      artifacts: false
    - job: generate-unit-tests-pipelines
      artifacts: false
  trigger:
    include:
      - artifact: .gitlab/generated/linux-unit-tests.yml
        job: generate-unit-tests-pipelines
    strategy: depend
  variables:
    PARENT_PIPELINE_ID: $CI_PIPELINE_ID

unit-tests-linux-arm64:
  stage: test
  needs:
    - job: build-linux-tracer-arm64
      artifacts: false
    - job: build-linux-tracer-arm64-musl
      artifacts: false
    - job: generate-unit-tests-pipelines
      artifacts: false
  trigger:
    include:
      - artifact: .gitlab/generated/linux-arm64-unit-tests.yml
        job: generate-unit-tests-pipelines
    strategy: depend
  variables:
    PARENT_PIPELINE_ID: $CI_PIPELINE_ID
