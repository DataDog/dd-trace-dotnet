# The dsm-throughput CI image is built in-repo from dsm-throughput/container/ via
# the shared benchmarking-platform-tools template (manual build-benchmark-ci-images
# job, moved to the benchmarks stage below).
# @see https://github.com/DataDog/benchmarking-platform-tools/blob/main/images/templates/gitlab/build-ci-images.template.yml
include:
  - project: 'DataDog/benchmarking-platform-tools'
    file: 'images/templates/gitlab/build-ci-images.template.yml'

variables:
  DSM_THROUGHPUT_CI_IMAGE: 486234852809.dkr.ecr.us-east-1.amazonaws.com/ci/benchmarking-platform:dd-trace-dotnet-dsm
  MACROBENCHMARKS_CI_IMAGE: 486234852809.dkr.ecr.us-east-1.amazonaws.com/ci/benchmarking-platform:dotnet-throughput-10

  # Image build, consumed by the included build-ci-images template. The per-pipeline
  # suffix pins each build to a unique tag so a rebuild can't shift what older
  # pipelines pulled. Repin DSM_THROUGHPUT_CI_IMAGE above to the tag this build pushes
  # (keep the old ECR pin until the first in-repo build succeeds).
  BASE_CI_IMAGE_SUFFIX: dd-trace-dotnet-dsm-throughput-${CI_PIPELINE_ID}
  BASE_CI_IMAGE_CONTAINER_DIR: .gitlab/benchmarks/dsm-throughput/container

stages:
  - check-azure-pipeline
  - benchmarks

workflow:
  auto_cancel:
    on_new_commit: interruptible

# The template defines the build job in a ci-image stage; run it in the
# benchmarks stage instead so it sits next to the jobs that consume the image
# (no new stage needed, per the microbenchmarks migration playbook).
build-benchmark-ci-images:
  stage: benchmarks

check_azure_pipeline:
  stage: check-azure-pipeline
  image: $MACROBENCHMARKS_CI_IMAGE
  script:
    - .gitlab/benchmarks/shared/wait-for-pipeline.sh
  artifacts:
    name: "artifacts"
    when: always
    paths:
      - artifacts/
      - build-id.txt
    expire_in: 3 months
  tags: ["arch:amd64"]
  timeout: 2h
  rules:
    - if: $CI_COMMIT_REF_NAME == "master"
      interruptible: false
    - interruptible: true

dsm_throughput:
  stage: benchmarks
  tags: ["runner:apm-k8s-same-cpu"]
  needs: ["check_azure_pipeline"]
  image: $DSM_THROUGHPUT_CI_IMAGE
  timeout: 1h
  retry:
    max: 2
    when:
      - unknown_failure
      - data_integrity_failure
      - runner_system_failure
      - scheduler_failure
      - api_failure
  script:
    - source build-id.txt
    - export ARTIFACTS_DIR="$(pwd)/artifacts" && (mkdir "${ARTIFACTS_DIR}" || :)
    # Redirect GitHub clone URLs to GitLab mirrors. Both orgs are covered:
    # - DataDog: OSS org (stays)
    # - GITHUB_ORG_INTERNAL: GitHub org for internal repos
    - git config --global url."https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.ddbuild.io/${GITLAB_GROUP}/".insteadOf "https://github.com/DataDog/"
    - git config --global url."https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.ddbuild.io/${GITLAB_GROUP}/".insteadOf "https://github.com/${GITHUB_ORG_INTERNAL}/"
    - cd .gitlab/benchmarks/dsm-throughput
    - ./steps/setup-sut.sh
    - bp-runner bp-runner.yml --debug
  artifacts:
    name: "artifacts"
    when: always
    paths:
      - artifacts/
    expire_in: 3 months
  rules:
    - if: $CI_COMMIT_REF_NAME == "master"
      interruptible: false
    - interruptible: true
