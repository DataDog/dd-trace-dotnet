workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "parent_pipeline"'

.windows-unit-test:
  stage: test
  timeout: 1h
  tags: ["windows-v2:2022"]
  needs:
    - pipeline: "$PARENT_PIPELINE_ID"
      job: build
      artifacts: true
  hooks:
    pre_get_sources_script:
      - git config --system core.longpaths true
  script:
    - |
      $env:WINDOWS_BUILD_IMAGE = & .gitlab/get-windows-build-image.ps1
      New-Item -ItemType Directory -Force artifacts/build_data/infra_logs | Out-Null

      Write-Output "Running managed unit tests for $env:FRAMEWORK with $env:WINDOWS_BUILD_IMAGE"

      $containerEnvironment = @(
        'DD_LOGGER_ENABLED=true',
        'DD_LOGGER_DD_API_KEY',
        'DD_STS_OIDC_TOKEN',
        'FRAMEWORK',
        'DD_LOGGER_DD_SERVICE=dd-trace-dotnet',
        'DD_LOGGER_DD_TRACE_LOG_PATH=c:\mnt\artifacts\build_data\infra_logs\ci-visibility.log',
        "DD_LOGGER_DD_TAGS=test.configuration.job:$env:CI_JOB_NAME",
        'GITLAB_CI',
        'CI_PROJECT_URL',
        'CI_PIPELINE_ID',
        'CI_REPOSITORY_URL',
        'CI_COMMIT_SHA',
        'CI_COMMIT_BRANCH',
        'CI_COMMIT_TAG',
        'CI_COMMIT_REF_NAME',
        'CI_PROJECT_DIR=c:\mnt',
        'CI_PROJECT_PATH',
        'CI_PIPELINE_IID',
        'CI_PIPELINE_URL',
        'CI_JOB_URL',
        'CI_JOB_NAME',
        'CI_JOB_STAGE',
        'CI_COMMIT_MESSAGE',
        'CI_COMMIT_AUTHOR',
        'CI_COMMIT_TIMESTAMP',
        'CI_RUNNER_ID',
        'CI_RUNNER_TAGS',
        'CI_MERGE_REQUEST_SOURCE_BRANCH_SHA',
        'CI_MERGE_REQUEST_TARGET_BRANCH_SHA',
        'CI_MERGE_REQUEST_DIFF_BASE_SHA',
        'CI_MERGE_REQUEST_TARGET_BRANCH_NAME',
        'CI_MERGE_REQUEST_IID'
      )
      & .gitlab/run-windows-container.ps1 -Image $env:WINDOWS_BUILD_IMAGE -EntryPoint powershell `
        -Environment $containerEnvironment -Command @(
          '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', 'c:\mnt\.gitlab\run-managed-unit-tests.ps1'
        )
      if ($LASTEXITCODE -ne 0) {
        throw "Managed unit tests for $env:FRAMEWORK exited with code $LASTEXITCODE"
      }
  artifacts:
    when: always
    expire_in: 2 weeks
    name: "managed-unit-tests-$FRAMEWORK"
    paths:
      - artifacts/build_data/results
      - artifacts/build_data/logs
      - artifacts/build_data/infra_logs
      - artifacts/build_data/dumps
  id_tokens:
    DD_STS_OIDC_TOKEN:
      aud: dd-sts
