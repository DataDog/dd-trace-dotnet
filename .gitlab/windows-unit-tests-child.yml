.windows-unit-test:
  stage: test
  timeout: 1h
  tags: ["windows-v2:2022"]
  needs:
    - pipeline: "$PARENT_PIPELINE_ID"
      job: build
      artifacts: true
  hooks:
    pre_get_sources_script:
      - git config --system core.longpaths true
  script:
    - |
      $hash = & tracer/build/_build/docker/gitlab/compute-image-hash.ps1
      if ($LASTEXITCODE -ne 0 -or $hash -notmatch '^[0-9a-f]{12}$') {
        throw "compute-image-hash.ps1 did not produce a valid hash (exit=$LASTEXITCODE, output='$hash')"
      }
      $env:WINDOWS_BUILD_IMAGE = "${env:WINDOWS_BUILD_IMAGE_BASE}:${hash}"
      New-Item -ItemType Directory -Force artifacts/build_data/infra_logs | Out-Null

      if (-not $env:DD_LOGGER_DD_API_KEY) {
        if (-not $env:DD_STS_OIDC_TOKEN) {
          throw "DD_STS_OIDC_TOKEN is unavailable"
        }

        $response = Invoke-RestMethod `
          -Uri "https://dd-sts.us1.ddbuild.io/sts/datadog/exchange?policy=apm-sdks-api-key" `
          -Headers @{ Authorization = "Bearer $env:DD_STS_OIDC_TOKEN" }
        if (-not $response.api_key) {
          throw "The dd-sts response did not contain an API key"
        }

        $env:DD_LOGGER_DD_API_KEY = $response.api_key
        Write-Output "CI Visibility API key configured using dd-sts"
      }

      Write-Output "Running managed unit tests for $env:FRAMEWORK with $env:WINDOWS_BUILD_IMAGE"

      docker run --rm -m 20480M `
        -v "$(Get-Location):c:\mnt" `
        -e CI_JOB_ID=${CI_JOB_ID} `
        -e WINDOWS_BUILDER=true `
        -e AWS_NETWORKING=true `
        -e NUGET_CERT_REVOCATION_MODE=offline `
        -e DD_LOGGER_ENABLED=true `
        -e DD_LOGGER_DD_API_KEY `
        -e DD_LOGGER_DD_SERVICE=dd-trace-dotnet `
        -e DD_LOGGER_DD_TRACE_LOG_PATH=c:\mnt\artifacts\build_data\infra_logs\ci-visibility.log `
        -e "DD_LOGGER_DD_TAGS=test.configuration.job:$env:CI_JOB_NAME" `
        -e GITLAB_CI `
        -e CI_PROJECT_URL `
        -e CI_PIPELINE_ID `
        -e CI_REPOSITORY_URL `
        -e CI_COMMIT_SHA `
        -e CI_COMMIT_BRANCH `
        -e CI_COMMIT_TAG `
        -e CI_COMMIT_REF_NAME `
        -e CI_PROJECT_DIR=c:\mnt `
        -e CI_PROJECT_PATH `
        -e CI_PROJECT_NAME `
        -e CI_PIPELINE_IID `
        -e CI_PIPELINE_URL `
        -e CI_JOB_URL `
        -e CI_JOB_NAME `
        -e CI_JOB_NAME_SLUG `
        -e CI_JOB_STAGE `
        -e CI_COMMIT_MESSAGE `
        -e CI_COMMIT_AUTHOR `
        -e CI_COMMIT_TIMESTAMP `
        -e CI_RUNNER_ID `
        -e CI_RUNNER_TAGS `
        -e CI_MERGE_REQUEST_SOURCE_BRANCH_SHA `
        -e CI_MERGE_REQUEST_TARGET_BRANCH_SHA `
        -e CI_MERGE_REQUEST_DIFF_BASE_SHA `
        -e CI_MERGE_REQUEST_TARGET_BRANCH_NAME `
        -e CI_MERGE_REQUEST_IID `
        --entrypoint cmd.exe `
        $env:WINDOWS_BUILD_IMAGE `
        /d /s /c `
        "reg add HKLM\SYSTEM\CurrentControlSet\Control\FileSystem /v LongPathsEnabled /t REG_DWORD /d 1 /f && powershell -NoProfile -ExecutionPolicy Bypass -File c:\mnt\.gitlab\install-windows-test-runtime.ps1 -Framework $env:FRAMEWORK && c:\entrypoint.bat BuildManagedUnitTests RunManagedUnitTests --framework $env:FRAMEWORK --IncludeAllTestFrameworks true --NugetPackageDirectory c:\mnt\packages"
      if ($LASTEXITCODE -ne 0) {
        throw "Managed unit tests for $env:FRAMEWORK exited with code $LASTEXITCODE"
      }
  artifacts:
    when: always
    expire_in: 2 weeks
    name: "managed-unit-tests-$FRAMEWORK"
    paths:
      - artifacts/build_data/results
      - artifacts/build_data/logs
      - artifacts/build_data/infra_logs
      - artifacts/build_data/dumps
  id_tokens:
    DD_STS_OIDC_TOKEN:
      aud: rapid-seceng-sit
