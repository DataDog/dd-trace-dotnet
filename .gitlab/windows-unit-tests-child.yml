.windows-unit-test:
  stage: test
  timeout: 1h
  tags: ["windows-v2:2022"]
  needs:
    - pipeline: "$PARENT_PIPELINE_ID"
      job: build
      artifacts: true
  variables:
    AWS_SHARED_CREDENTIALS_FILE: ${CI_PROJECT_DIR}\.aws\credentials-by-job-id\${CI_JOB_ID}
  hooks:
    pre_get_sources_script:
      - git config --system core.longpaths true
  script:
    - |
      $hash = & tracer/build/_build/docker/gitlab/compute-image-hash.ps1
      if ($LASTEXITCODE -ne 0 -or $hash -notmatch '^[0-9a-f]{12}$') {
        throw "compute-image-hash.ps1 did not produce a valid hash (exit=$LASTEXITCODE, output='$hash')"
      }
      $env:WINDOWS_BUILD_IMAGE = "${env:WINDOWS_BUILD_IMAGE_BASE}:${hash}"
      New-Item -ItemType Directory -Force artifacts/build_data/infra_logs | Out-Null

      if (-not $env:DD_LOGGER_DD_API_KEY) {
        $ciIdentitiesClient = Join-Path $env:TEMP "ci-identities-gitlab-job-client-$env:CI_JOB_ID.exe"
        try {
          Write-Output "Trying to retrieve the CI Visibility API key using the repository CI Identity"
          if (-not $env:CI_IDENTITIES_CLIENT_URL) {
            throw "CI_IDENTITIES_CLIENT_URL is not set"
          }

          aws s3 cp --only-show-errors $env:CI_IDENTITIES_CLIENT_URL $ciIdentitiesClient
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to download the CI Identities client"
          }

          & $ciIdentitiesClient assume-role
          if ($LASTEXITCODE -ne 0) {
            throw "The CI Identities client failed to assume the AWS role"
          }

          $apiKey = aws ssm get-parameter `
            --name "ci.dd-trace-dotnet.dd_api_key-prod" `
            --with-decryption `
            --query "Parameter.Value" `
            --output text `
            --region us-east-1
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($apiKey)) {
            throw "The repository CI Identity could not retrieve the CI API key from SSM"
          }

          $env:DD_LOGGER_DD_API_KEY = $apiKey.Trim()
          Write-Output "CI Visibility API key configured using the repository CI Identity"
        }
        catch {
          Write-Warning "CI Visibility API key is unavailable; test telemetry and retry metrics may not be submitted. $($_.Exception.Message)"
        }
        finally {
          Remove-Item -LiteralPath $ciIdentitiesClient -Force -ErrorAction SilentlyContinue
        }
      }

      Write-Output "Running managed unit tests for $env:FRAMEWORK with $env:WINDOWS_BUILD_IMAGE"

      docker run --rm -m 20480M `
        -v "$(Get-Location):c:\mnt" `
        -e CI_JOB_ID=${CI_JOB_ID} `
        -e WINDOWS_BUILDER=true `
        -e AWS_NETWORKING=true `
        -e NUGET_CERT_REVOCATION_MODE=offline `
        -e DD_LOGGER_ENABLED=true `
        -e DD_LOGGER_DD_API_KEY `
        -e DD_LOGGER_DD_TRACE_LOG_PATH=c:\mnt\artifacts\build_data\infra_logs\ci-visibility.log `
        -e "DD_LOGGER_DD_TAGS=test.configuration.job:$env:CI_JOB_NAME" `
        -e CI_IDENTITIES_GITLAB_ID_TOKEN `
        -e GITLAB_CI `
        -e CI_PROJECT_URL `
        -e CI_PIPELINE_ID `
        -e CI_REPOSITORY_URL `
        -e CI_COMMIT_SHA `
        -e CI_COMMIT_BRANCH `
        -e CI_COMMIT_TAG `
        -e CI_COMMIT_REF_NAME `
        -e CI_PROJECT_DIR=c:\mnt `
        -e CI_PROJECT_PATH `
        -e CI_PROJECT_NAME `
        -e CI_PIPELINE_IID `
        -e CI_PIPELINE_URL `
        -e CI_JOB_URL `
        -e CI_JOB_NAME `
        -e CI_JOB_NAME_SLUG `
        -e CI_JOB_STAGE `
        -e CI_COMMIT_MESSAGE `
        -e CI_COMMIT_AUTHOR `
        -e CI_COMMIT_TIMESTAMP `
        -e CI_RUNNER_ID `
        -e CI_RUNNER_TAGS `
        -e CI_MERGE_REQUEST_SOURCE_BRANCH_SHA `
        -e CI_MERGE_REQUEST_TARGET_BRANCH_SHA `
        -e CI_MERGE_REQUEST_DIFF_BASE_SHA `
        -e CI_MERGE_REQUEST_TARGET_BRANCH_NAME `
        -e CI_MERGE_REQUEST_IID `
        --entrypoint cmd.exe `
        $env:WINDOWS_BUILD_IMAGE `
        /d /s /c `
        "reg add HKLM\SYSTEM\CurrentControlSet\Control\FileSystem /v LongPathsEnabled /t REG_DWORD /d 1 /f && powershell -NoProfile -ExecutionPolicy Bypass -File c:\mnt\.gitlab\install-windows-test-runtime.ps1 -Framework $env:FRAMEWORK && c:\entrypoint.bat BuildManagedUnitTests RunManagedUnitTests --framework $env:FRAMEWORK --IncludeAllTestFrameworks true --NugetPackageDirectory c:\mnt\packages"
      if ($LASTEXITCODE -ne 0) {
        throw "Managed unit tests for $env:FRAMEWORK exited with code $LASTEXITCODE"
      }
  artifacts:
    when: always
    expire_in: 2 weeks
    name: "managed-unit-tests-$FRAMEWORK"
    paths:
      - artifacts/build_data/results
      - artifacts/build_data/logs
      - artifacts/build_data/infra_logs
      - artifacts/build_data/dumps
  id_tokens:
    CI_IDENTITIES_GITLAB_ID_TOKEN:
      aud: ci-identities
