parameters:
  - name: matrixVariable
    type: string

  - name: artifacts
    type: object
    default: []

jobs:
- template: update-github-status-jobs.yml
  parameters:
    jobs: [test]

- job: test
  timeoutInMinutes: 45
  variables:
    targetShaId: $[ stageDependencies.merge_commit_id.fetch.outputs['set_sha.sha']]
    targetBranch: $[ stageDependencies.merge_commit_id.fetch.outputs['set_sha.branch']]
  strategy:
    matrix: $[ stageDependencies.generate_variables.generate_variables_job.outputs['generate_variables_step.${{ parameters.matrixVariable }}'] ]

  steps:
  - template: ensure-docker-ready.yml

  # Diagnostic only: the Windows smoke test images are large and builds have failed with
  # "not enough space on the disk", so log what is already on the agent before any build
  - powershell: |
      # Prevent PowerShell from treating native command stderr as a terminating error
      $ErrorActionPreference = 'Continue'

      $dockerRoot = docker info --format '{{.DockerRootDir}}'
      if (-not $dockerRoot) { $dockerRoot = 'C:\' }
      $driveName = (Split-Path -Qualifier $dockerRoot).TrimEnd(':')

      Write-Host ("Docker root: {0}" -f $dockerRoot)
      Write-Host ("Free space on {0}: {1:N1} GB" -f $driveName, ((Get-PSDrive -Name $driveName).Free / 1GB))
      Get-PSDrive -PSProvider FileSystem | ForEach-Object {
          Write-Host ("Drive {0}: used {1:N1} GB, free {2:N1} GB" -f $_.Name, ($_.Used / 1GB), ($_.Free / 1GB))
      }
      docker system df
      docker images --all --format 'table {{.Repository}}\t{{.Tag}}\t{{.ID}}\t{{.Size}}'
      exit 0
    displayName: Log docker disk usage

  - template: clone-repo.yml
    parameters:
      targetShaId: $(targetShaId)
      targetBranch: $(targetBranch)

  # Download required artifacts to the output directory
  - ${{ each artifact in parameters.artifacts }}:
    - template: download-artifact.yml
      parameters:
        artifact: ${{ artifact }}
        path: $(outputDir)

  - template: install-latest-dotnet-sdk.yml
  - script: tracer\build.cmd RunArtifactSmokeTests CheckSmokeTestsForErrors ExtractMetricsFromLogs -SmokeTestCategory $(category) -SmokeTestScenario $(scenario) --Artifacts $(outputDir)
    displayName: Run Nuke smoke test
    env:
      DD_LOGGER_DD_API_KEY: $(ddApiKey)

  - publish: artifacts/build_data
    artifact: _$(System.StageName)_$(Agent.JobName)_logs_$(System.JobAttempt)
    condition: always()
    continueOnError: true
