# Uploads the gtest JUnit reports of the native unit tests to Datadog Test Optimization, so their
# failures are reported as test failures (managed tests already report through the tracer).
steps:
- bash: |
    set -euo pipefail
    shopt -s nullglob
    reports=(profiler/build_data/tests/*.xml artifacts/build_data/tests/*.xml)
    if [ ${#reports[@]} -eq 0 ]; then
      echo "No native test report found, nothing to upload"
      exit 0
    fi
    case "$(uname -m)" in
      x86_64) arch=x64 ;;
      aarch64|arm64) arch=arm64 ;;
      *) echo "Unsupported architecture $(uname -m), skipping upload"; exit 0 ;;
    esac
    curl --fail --retry 3 --retry-delay 5 --retry-connrefused --retry-all-errors -sSL \
      -o "$(Agent.TempDirectory)/datadog-ci" \
      "https://github.com/DataDog/datadog-ci/releases/download/v5.26.1/datadog-ci_linux-${arch}"
    chmod +x "$(Agent.TempDirectory)/datadog-ci"
    "$(Agent.TempDirectory)/datadog-ci" junit upload "${reports[@]}" --service dd-trace-dotnet --env ci
  displayName: Upload native test results to Test Optimization
  condition: succeededOrFailed()
  continueOnError: true
  env:
    DATADOG_SITE: datadoghq.com
    DATADOG_API_KEY: $(ddApiKey)
