# Uploads the gtest JUnit reports of the native unit tests to Datadog Test Optimization, so their
# failures are reported as test failures (managed tests already report through the tracer).
# Reporting only: any failure here is logged as a warning and never fails the job.
steps:
- bash: |
    shopt -s nullglob
    reports=(profiler/build_data/tests/*.xml artifacts/build_data/tests/*.xml)
    if [ ${#reports[@]} -eq 0 ]; then
      echo "No native test report found, nothing to upload"
      exit 0
    fi
    case "$(uname -m)" in
      x86_64) arch=x64 ;;
      aarch64|arm64) arch=arm64 ;;
      *) echo "##vso[task.logissue type=warning]Unsupported architecture $(uname -m), native test results not uploaded"; exit 0 ;;
    esac
    datadog_ci="$(Agent.TempDirectory)/datadog-ci"
    if ! curl --fail --retry 3 --retry-delay 5 --retry-connrefused --retry-all-errors -sSL -o "$datadog_ci" \
        "https://github.com/DataDog/datadog-ci/releases/download/v5.26.1/datadog-ci_linux-${arch}"; then
      echo "##vso[task.logissue type=warning]Could not download datadog-ci, native test results not uploaded"
      exit 0
    fi
    chmod +x "$datadog_ci"
    if ! "$datadog_ci" junit upload "${reports[@]}" --service dd-trace-dotnet --env ci; then
      echo "##vso[task.logissue type=warning]datadog-ci junit upload failed, native test results not uploaded"
    fi
    exit 0
  displayName: Upload native test results to Test Optimization
  condition: succeededOrFailed()
  env:
    DATADOG_SITE: datadoghq.com
    DATADOG_API_KEY: $(ddApiKey)
