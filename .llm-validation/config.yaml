model: claude-opus-4-8
runs: 3

instruction_files:
  - AGENTS.md
  - .claude/skills/bump-libdatadog/SKILL.md
  - .claude/skills/bump-libdatadog/scripts/fetch-release-hashes.sh

# Complete guidance inventory for setup comparison; instruction-change targeting above is unchanged.
# The platform currently supports inventory/selection planning with --comparison setup --dry-run.
# .claude/settings.json contains telemetry attributes only and is retained as common configuration.
# Personal settings.local.json must be excluded from both variants by the isolated runner.
setup:
  files:
    - CLAUDE.md
    - AGENTS.md
  directories:
    - .claude/skills/add-lint-rule
    - .claude/skills/analyze-azdo-build
    - .claude/skills/azure-functions
    - .claude/skills/bump-libdatadog

default_level: gate
presets:
  gate:
    cases:
      - dotnet-tracer-logging-terminology-004
      - dotnet-tracer-nuget-scope-hallucination-008
      - dotnet-tracer-repo-nav-integration-001
      - dotnet-tracer-confirm-instrumentation-011
      - dotnet-tracer-bump-libdatadog-013
      - dotnet-tracer-control-context-propagation-016
    runs: 8
  minimum:
    cases: ["dotnet-tracer-logging-terminology-004", "dotnet-tracer-bump-libdatadog-013"]
    runs: 4
  full:
    runs: 3

# These thresholds decide when a *blocking* case's pairwise regression actually FAILs:
policy:
  noise_threshold: 1.0
  pairwise_win_floor: 0.45
  blocking_fail_floor: 0.45
  blocking_fail_ci_upper: 0.55
