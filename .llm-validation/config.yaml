model: claude-opus-4-8
runs: 3

instruction_files:
  - AGENTS.md
  - .claude/skills/bump-libdatadog/SKILL.md
  - .claude/skills/bump-libdatadog/scripts/fetch-release-hashes.sh
  - .agents/skills/dd-apm-sdk-review/SKILL.md
  - .agents/skills/dd-apm-sdk-review/reviewers/_common.md
  - .agents/skills/dd-apm-sdk-review/reviewers/coherence.md
  - .agents/skills/dd-apm-sdk-review/reviewers/correctness.md
  - .agents/skills/dd-apm-sdk-review/reviewers/security.md
  - .agents/skills/dd-apm-sdk-review/reviewers/design.md
  - .agents/skills/dd-apm-sdk-review/reviewers/performance.md
  - .agents/skills/dd-apm-sdk-review/reviewers/maintainability.md
  - .agents/skills/dd-apm-sdk-review/reviewers/conventions.md
  - .agents/skills/dd-apm-sdk-review/reviewers/cross-sdk.md
  - .agents/skills/dd-apm-sdk-review/reviewers/report-template.md
  - .agents/skills/dd-apm-sdk-review/review-without-harness.md
  - .agents/dd-apm-sdk-review-overrides/repo-context.md
  - .agents/dd-apm-sdk-review-overrides/reviewers/performance.md

default_level: gate
presets:
  gate:
    cases:
      - dotnet-tracer-logging-terminology-004
      - dotnet-tracer-nuget-scope-hallucination-008
      - dotnet-tracer-repo-nav-integration-001
      - dotnet-tracer-confirm-instrumentation-011
      - dotnet-tracer-bump-libdatadog-013
      - dotnet-tracer-control-context-propagation-016
      - dotnet-perf-params-hotpath
    runs: 8
  minimum:
    cases: ["dotnet-tracer-logging-terminology-004", "dotnet-tracer-bump-libdatadog-013"]
    runs: 4
  full:
    runs: 3

# These thresholds decide when a *blocking* case's pairwise regression actually FAILs:
policy:
  noise_threshold: 1.0
  pairwise_win_floor: 0.45
  blocking_fail_floor: 0.45
  blocking_fail_ci_upper: 0.55